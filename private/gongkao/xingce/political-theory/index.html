/* pagevault styles */

pagevault {
  display: block;
}

pagevault[data-pv-v4] {

  justify-content: center;

.pagevault-container {
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  border-radius: 8px;
  background: #f9f9f9;
  max-width: 400px;
  margin: 2rem auto;

.pagevault-icon {
  font-size: 3rem;
  margin-bottom: 1rem;

  font-size: 1.25rem;

  margin-bottom: 0.5rem;

.pagevault-hint {
  color: #666;
  font-size: 0.9rem;
  margin-bottom: 1rem;

.pagevault-form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;

  padding: 0.75rem 1rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;

  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, #3b79d5, #6da0ed);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}

.pagevault-button:hover {
  opacity: 0.9;
}

.pagevault-button:disabled {
  opacity: 0.5;

.pagevault-error {
  color: #dc3545;

.pagevault-remember {
