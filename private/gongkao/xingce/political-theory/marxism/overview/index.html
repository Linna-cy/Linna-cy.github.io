    # 马克思主义

## 总论

### 《共产党宣言》

- 其发表标志着马克思主义的公开问世
- 首个中译本由陈望道翻译

### 基本特征

- 科学性：体现理论正确性，被实践证明为真理体系
- 革命性
    - 为无产阶级革命提供理论指导
    - 内含辩证法的批判精神
- **实践性**
    - 马克思主义**首要的基本观点**
    - 强调"从实践中来，到实践中去"
- **人民性**：坚持**人民至上的政治立场**，认为人民是历史的创造者
- 发展性：具有**与时俱进的理论品质**
	
### 马克思的核心发现

- 唯物史观
- 剩余价值学说
- 理论地位：构成马克思主义理论体系的**独创**性贡献

## 马克思主义哲学

- 源于德国古典哲学（包含黑格尔辩证法、费尔巴哈唯物主义）

### 哲学的含义

- 哲学是理论化、系统化的世界观，是世界观和方法论的统一。
- 哲学是对自然知识、社会知识和思维知识的概括和总结。
- 世界观：对于世界的观点和看法，哲学 $\neq$ 世界观
- 方法论：基于世界观，如何解决问题的方法
- 世界观与方法论的核心关系
    - 决定关系：世界观决定方法论
    - 体现关系：方法论体现世界观

### 具体科学与哲学的关系

    - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的
    - 基础作用：具体科学是哲学的基础
    - 指导作用：哲学为具体科学提供世界观和方法论指导
    - 哲学结论：**世界是不断发展的**
    - 哲学与具体科学不是整体与部分的关系
        - 哲学是一般的、共性的，具体科学是特殊的、个性的
        - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括

### 哲学的基本派别

#### 划分依据

- 对哲学的基本问题（本原问题）的回答不同
    - 哲学的基本问题是物质与意识（或思维与存在）的关系问题
- **第一性问题**：探究世界的本原。
    - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点
    - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点
- 同一性问题：探究世界是否可知的问题。
    - 可知论：认为世界是可知的，意识能够认识物质世界
        - 马克思认为世界是可知的
    - 不可知论：意识不能认识客观世界

#### 唯物主义

- 划分标准：对于物质概念理解的不同
- 古代朴素唯物主义：认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等
    - 有时代局限性，不是完全科学
    - 根本正确性
        - 承认物质是世界的本原这一基本观点是正确的
    - 认识局限性
        - 笼统性：将物质简单归结为具体物质形态，缺乏科学依据
        - 直观猜测性：对物质的理解停留在直观猜测层面
        - 无法解释复杂物质现象和精神现象的关系
- 近代形而上学唯物主义：基于原子论所形成
    - 别称：机械唯物主义（机械性）、半截子唯物主义（不彻底性）
    - 缺陷
        - 机械性
            - 认为宇宙间所有运动都是机械运动
            - 错误本质：将高级运动形式简单归结为机械位移
        - **形而上学性**
            - 基本特征：**孤立、片面、静止**地看问题
            - 孤立观点：否认事物之间的普遍联系
            - 静止观点：否认事物的运动和发展
            - 片面观点：否认认识的全面性和辩证性
        - 不彻底性：唯物不彻底
            - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义
            - 本质：未能将唯物主义原则贯彻到底
- 现代唯物主义
    - 马克思主义哲学是唯物主义发展的现代形态
    - 本质属性是"**客观实在性**"
        - 客观实在性不是具体物质形态，而是抽象出的共同属性
    - 物质：标志客观实在的哲学范畴
    - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态

#### 唯心主义

- 主观唯心主义
    - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切
    - 强调"**人**、**我**、**心**"等主体要素
- 客观唯心主义
    - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原
- 关键区别：精神主体是否独立于人类意识存在

### 辩证唯物主义

#### 唯物论

##### 物质

- 研究世界的本原问题
- 唯一特性（本质属性）：是**客观实在性**
    - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性
    - 客观：不以人的意志为转移
    - 实在：能够被人的意识所反映
- 运动
    - 运动是物质的**根本属性**、**固有属性**和**存在方式**
        - 运动是**无条件的**、**永恒的**、**绝对的**
    - 物质是运动的承担者，是运动的主体
- 静止：是一种不显著的运动，是运动的一种特殊状态
    - 静止是**有条件的**、**暂时的**、**相对的**
    - _不存在绝对静止的物质_
- 世界上的事物都是绝对运动和相对静止的统一
- 时间和空间是运动着的物质的存在方式
    - 空间：占据位置
    - 时间：存在过程
        - 时间特性：时间具有一维性，即时间是不可逆的

##### 意识

- 本质是人脑对客观存在的主观映象
    - _强调客观存在通过人脑形成主观认知的过程_
- 来源于客观存在（客观世界）
    - 人脑：意识的器官
    - 意识并非来源（产生）于人脑
    - 仅有大脑而无客观接触无法形成意识
- 就其形式而言是主观的，就其内容而言是客观的
    - 形式主观：个体表达存在差异，不同人描述同一事物方式不同
	- 内容客观：反映对象真实存在，基于客观存在的事物进行反映
- 能动作用
    - 目的性和计划性：意识活动具有目的性和计划性
	- 创造性：意识活动具有创造性
	- 指导作用：意识具有**指导实践改造客观世界的作用**
		- 意识不能直接改造世界（仅靠想象无法改变现实）
		- 精神力量需通过实践转化为物质力量
	- 调控作用：意识具有调控行为和生理活动的作用

##### 物质与意识的辩证关系

- 原理
    - 物质决定意识
        - 客观世界未出现的物质不会产生相应意识
    - 意识具有能动作用
        - 正确的意识起促进作用
        - 错误的意识起阻碍作用
- 方法论
    - 一切从实际出发
    - 重视发挥主观能动性：尊重客观规律是正确发挥主观能动性的前提
- 规律的客观性
    - 规律具有客观性
        - 不能创造、消灭或改变规律
        - 只能认识、利用规律
        - 可以改变规律发生作用的条件
    - 意味着规律不依赖于人的意识，不以人的意志为转移

#### 辩证法

- 两大特征：联系和发展

##### 联系

- 特征
    - **客观性**：强调联系是客观的，不以人的意志为转移
        - 客观联系
            - 自在事物的联系：指自然界本身存在的联系
            - 人为事物的联系：指人为建立起来的联系
        - 违背客观性的联系
            - 人为强加的联系：指主观臆造、没有现实依据的联系
    - **普遍性**：强调联系是普遍存在的
        - 事物处于普遍联系之中
    - 条件性：联系需要特定条件才能建立
        - 不是随便两个事物天然就存在联系
        - 建立条件：依据固有联系 + 相应客观条件
            - 人可以根据固有联系，改变事物状态，调整原有联系，建立新的具体联系，不能根据主观需要建立新的联系（通过创造条件来建立联系）
    - 多样性：联系具有多种类型和多种方式
- 整体与部分的关系
    - 也可称为系统与要素的关系
    - 依赖关系：整体与部分相互依赖
    - 决定关系
        - 整体决定部分
        - 部分影响整体
        - 只有**关键部分才能决定整体**
            - 关键部分在一定条件下对整体起决定作用
    - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能
        - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌
        - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$）
        - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果

##### 发展

- 实质是**新事物的产生**和**旧事物的灭亡**
    - 新旧事物区分
        - 是否同事物发展的必然趋势相符合
        - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物
        - 力量强大的事物 $\neq$ 新事物
    - 新事物：符合事物发展的必然趋势
    - 旧事物：不符合事物发展的必然趋势
- 将前进的、上升的运动称为"发展"

##### 三大规律

##### 对立统一规律

- 是辩证法的**实质与核心**，又称为矛盾规律
- 矛盾的基本属性
    - 同一性
        - 有条件的、相对的
        - 相互依存：指的是矛盾双方互为存在的前提
            - "你离不开我，我离不开你"
        - 相互贯通
            - 相互渗透：矛盾双方相互包含
                - "你中有我，我中有你"
            - 相互转化：在一定条件下，由矛盾的一方转化为另一方
                - "你变成了我，我变成了你"
    - 斗争性
        - 无条件的、绝对的
            - 无条件性：斗争性在任何条件下都存在
        - 相互排斥：矛盾双方相互对抗的关系
            - "你多我少"，"你死我活"，"死对头"
        - 相互分离：矛盾双方保持各自独立性质。
	        - "你就是你，我就是我"
    - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现
- 矛盾问题的精髓
    - 普遍性：指矛盾是**无处不在**，**无时不有**
        - 无条件的、绝对的
        - 方法论：全面地看问题（一分为二的观点看问题）
            - 要同时看到一个事物的多方面（如好和坏）
    - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性）
        - 有条件的、相对的
            - 特殊性需要经过对比得来，多种情况之间互为条件
        - 方法论：具体问题具体分析
    - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性
        - 普遍性存在于特殊性之中：共性存在于每个个体之中
- 矛盾发展的不平衡性
    - 指事物从性质、地位、作用上的不一致（有主有次）
    - 主次矛盾
        - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的
        - 次要矛盾：在事物发展过程中处于从属地位的
        - 主次矛盾的关系
            - 制约关系：主要矛盾制约次要矛盾的发展方向
            - 反作用：次要矛盾会影响主要矛盾
            - 主次矛盾转化：主次矛盾在一定条件下可以相互转化
                - 转化条件：当客观环境发生变化时，主次矛盾可能互换
                - 阶段特征：人生不同阶段主要矛盾不同
        - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理
    - 矛盾的主次方面
        - 主要方面：处于支配地位，起主导作用
        - 次要方面：处于被支配地位
        - 矛盾主次方面的关系
            - 决定关系：**事物的性质由主要矛盾的主要方面决定**
            - 制约关系：次要方面制约主要方面的发挥
            - 主次方面转化：主次方面在一定条件下可以相互转化
                - 转化条件：当内外条件变化时，主次方面可能互换
                - 性质改变：主次方面转化会导致事物根本性质变化
        - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理
    - 不平衡性的方法论：在于坚持两点论和重点论的统一
        - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题
        - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节
- 内因和外因
    - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用
    - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展
    - 关系：外因通过内因而起作用

##### 量变质变规律

- 区分的根本标志：判断**事物的变化是否超出度的范围**
- 辩证关系
    - 量变是质变的必要准备
    - 质变是量变的必然结果，量变达到**一定程度**（**临界点**）必然引起质变
    - 量变和质变相互渗透，互相包含
- 方法论：坚持**适度原则**
    - 坚持底线思维：保持变化在合理区间内，不要突破底线，否则可能会变质（往坏的方向质变，如贪污腐败）

##### 否定之否定规律

- 强调事物的发展呈现螺旋式上升、波浪式前进的规律
- 辩证的否定观
    - **包含肯定的否定**
        - 肯定其积极的方面，否定其消极的方面
        - 区别于形而上学的全盘肯定/否定
    - 事物的自我否定：强调内因对于事物的发展起决定作用
    - 实质是"**扬弃**"
        - 扬弃：既克服（糟粕）又保留（精华）的双重过程
        - 区别于"新事物产生旧事物灭亡"的发展实质
    - 发展和联系的环节：辩证的否定，是联系的环节，也是发展的环节
        - 发展的环节：只有否定旧事物，事物才能向前发展。
	    - 联系的环节：新旧事物之间保留合理因素，通过辩证否定联系在一起
- 发展过程：**前进性和曲折性的统一**
    - 总趋势具有前进性
    - 具体道路具有曲折性

#### 认识论

##### 实践

- 含义：人类能动地改造世界的社会性的客观物质活动
    - 实践的主体：人类
    - 实践的客体：客观世界
- 特征
    - 客观物质性
        - 要素客观：实践的主体、客体、中介（如工具）等各方面要素都是客观的
	    - 规律制约：实践会受客观规律制约
    - 直接现实性：能将主观想法（意愿）通过实际行动转化为客观现实
        - 意识活动不具有直接现实性
        - 实践活动不能突破客观条件或社会历史条件的制约
    - 自觉能动性：强调的是实践是人**有意识**、**有目的**的活动（区别于动物本能）
    - 社会历史性
        - 社会性：实践需在一定的社会关系中完成。
	    - 历史性
            - 历史地形成：实践是在特定的历史时期中形成的，实践受当时特定的历史条件限制
		    - 历史地发展：实践经验具有继承性，后世的实践经验继承（借鉴）了前人的实践经验
- 基本形式：根据实践领域划分
    - **物质生产实践**：**最基础的实践活动**，决定人类生存
    - 社会政治实践：指改造社会关系的实践活动，是人们调整和处理人与人之间社会关系的实践
        - 社会实践：是狭义的社会实践，指处理人与人社会关系的实践
        - 政治实践
            - 阶级对立：稳定社会中的阶级矛盾
            - 阶级斗争：社会矛盾已经不可调和时，或矛盾激化后所产生的暴力冲突
    - 科学文化实践：指探索未知、精神文化创作等实践活动，包含科学、艺术、教育等实践形式

##### 认识

- 从认识论角度阐述的人对客观世界的认知，本质上是人脑对客观存在的主观映象
- 与意识的关系：认识是意识在认识论层面的具体表现，二者都涉及对客观世界的反映
- 基本属性
    - 客观性：认识来源于客观世界并受客观事物制约
        - 本质：认识内容不能脱离客观存在凭空产生
    - 主观性：不同主体对同一事物产生差异性认知

###### 认识的两次飞跃

1. 第一次飞跃：从**感性认识到理性认识**的过程
    - 感性认识：对事物表面现象的认知
		- 感觉：对事物单一特征的反应
		- 知觉：对事物综合特征的反应
		- 表象：事物在头脑中的回忆形象
	- 理性认识：对事物本质规律的认知
		- 概念：对事物下定义
        - 判断：依据概念判定事物属性
        - 推理：由已知推断未知
            - 理性认识不必然正确（推理结论可能错误）
2. 第二次飞跃：从**理性认识到实践**的过程
    - 本质：将形成的理性认识应用于实际生产生活动
- [实践是认识的目的和归宿](../philosophy/epistemology#实践决定认识)，产生认识后，最终要回归到实践当中
- 认识的真正任务是要达到理性认识

###### 认识的过程

- 反复性：复杂事物需要多次认识
- 无限性：客观世界是不断发展的，认识也随之不断发展

###### 认识的运动规律

- 核心：实践 $\rightarrow$ 认识 $\rightarrow$ 再实践 $\rightarrow$ 再认识，循环往复以至无穷，每次循环进入更高阶段
- 总体呈现螺旋式上升趋势

###### 真理

- 标志着主观认识与客观实际相符合的哲学范畴
- 是一种正确的认识（区别于一般的理性认识）
- 属性
    - 客观性（**本质属性**）
        - 内容客观：真理内容不依赖于人的意识
        - 检验标准客观：[实践作为检验标准](../philosophy/epistemology#实践决定认识)具有[直接现实性（客观实在性）](../philosophy/epistemology#实践的特征)
    - 绝对性（绝对真理）：真理是无条件的、绝对的
        - 强调真理内容的确定性
    - 相对性（相对真理）：真理的条件性
        - 指真理的成立需要特定条件限制
        - 强调真理适用条件的局限性
    - 内容无条件正确，范围有条件限定

##### 辩证关系

- 实践决定认识
    1. 实践是认识的**唯一来源**
        - 认识只能通过实践获得，强调"**从无到有**"的过程
        - 途径：
            - 直接经验：通过亲身实践获得
	        - 间接经验：通过他人实践获得
            - 实践并不是认识的唯一途径
    2. 实践是认识发展的**动力**
        - 通过实践推动认识发展，强调认识"从旧到新"或"从有到优"的演进过程
        - 动力来源
            - 新的需求：实践过程中产生了新需求，推动认识向前发展
            - 新的物质手段：实践为认识的发展提供了新的物质手段
    3. 实践是认识的**目的和归宿**：核心要义是指认识最终要指导实践来改造世界
    4. 实践是检验认识是否具有真理性的**唯一标准**
- 认识对实践的作用
    - 正确的认识起促进作用
    - 错误的认识起阻碍作用（认识对实践的反作用）

' name="description"/><meta content="summary" name="twitter:card"/><meta content="马克思主义基本原理——概览（持续更新中）" name="twitter:title"/><meta content='# 马克思主义 ## 总论 ### 《共产党宣言》 - 其发表标志着马克思主义的公开问世 - 首个中译本由陈望道翻译 ### 基本特征 - 科学性：体现理论正确性，被实践证明为真理体系 - 革命性 - 为无产阶级革命提供理论指导 - 内含辩证法的批判精神 - **实践性** - 马克思主义**首要的基本观点** - 强调"从实践中来，到实践中去" - **人民性**：坚持**人民至上的政治立场**，认为人民是历史的创造者 - 发展性：具有**与时俱进的理论品质** ### 马克思的核心发现 - 唯物史观 - 剩余价值学说 - 理论地位：构成马克思主义理论体系的**独创**性贡献 ## 马克思主义哲学 - 源于德国古典哲学（包含黑格尔辩证法、费尔巴哈唯物主义） ### 哲学的含义 - 哲学是理论化、系统化的世界观，是世界观和方法论的统一。 - 哲学是对自然知识、社会知识和思维知识的概括和总结。 - 世界观：对于世界的观点和看法，哲学 $\neq$ 世界观 - 方法论：基于世界观，如何解决问题的方法 - 世界观与方法论的核心关系 - 决定关系：世界观决定方法论 - 体现关系：方法论体现世界观 ### 具体科学与哲学的关系 - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的 - 基础作用：具体科学是哲学的基础 - 指导作用：哲学为具体科学提供世界观和方法论指导 - 哲学结论：**世界是不断发展的** - 哲学与具体科学不是整体与部分的关系 - 哲学是一般的、共性的，具体科学是特殊的、个性的 - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括 ### 哲学的基本派别 #### 划分依据 - 对哲学的基本问题（本原问题）的回答不同 - 哲学的基本问题是物质与意识（或思维与存在）的关系问题 - **第一性问题**：探究世界的本原。 - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点 - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点 - 同一性问题：探究世界是否可知的问题。 - 可知论：认为世界是可知的，意识能够认识物质世界 - 马克思认为世界是可知的 - 不可知论：意识不能认识客观世界 #### 唯物主义 - 划分标准：对于物质概念理解的不同 - 古代朴素唯物主义：认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等 - 有时代局限性，不是完全科学 - 根本正确性 - 承认物质是世界的本原这一基本观点是正确的 - 认识局限性 - 笼统性：将物质简单归结为具体物质形态，缺乏科学依据 - 直观猜测性：对物质的理解停留在直观猜测层面 - 无法解释复杂物质现象和精神现象的关系 - 近代形而上学唯物主义：基于原子论所形成 - 别称：机械唯物主义（机械性）、半截子唯物主义（不彻底性） - 缺陷 - 机械性 - 认为宇宙间所有运动都是机械运动 - 错误本质：将高级运动形式简单归结为机械位移 - **形而上学性** - 基本特征：**孤立、片面、静止**地看问题 - 孤立观点：否认事物之间的普遍联系 - 静止观点：否认事物的运动和发展 - 片面观点：否认认识的全面性和辩证性 - 不彻底性：唯物不彻底 - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义 - 本质：未能将唯物主义原则贯彻到底 - 现代唯物主义 - 马克思主义哲学是唯物主义发展的现代形态 - 本质属性是"**客观实在性**" - 客观实在性不是具体物质形态，而是抽象出的共同属性 - 物质：标志客观实在的哲学范畴 - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态 #### 唯心主义 - 主观唯心主义 - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切 - 强调"**人**、**我**、**心**"等主体要素 - 客观唯心主义 - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原 - 关键区别：精神主体是否独立于人类意识存在 ### 辩证唯物主义 #### 唯物论 ##### 物质 - 研究世界的本原问题 - 唯一特性（本质属性）：是**客观实在性** - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性 - 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止：是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性：尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 可以改变规律发生作用的条件 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 建立条件：依据固有联系 + 相应客观条件 - 人可以根据固有联系，改变事物状态，调整原有联系，建立新的具体联系，不能根据主观需要建立新的联系（通过创造条件来建立联系） - 多样性：联系具有多种类型和多种方式 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 关键部分在一定条件下对整体起决定作用 - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心**，又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：斗争性在任何条件下都存在 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - 有条件的、相对的 - 特殊性需要经过对比得来，多种情况之间互为条件 - 方法论：具体问题具体分析 - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性 - 普遍性存在于特殊性之中：共性存在于每个个体之中 - 矛盾发展的不平衡性 - 指事物从性质、地位、作用上的不一致（有主有次） - 主次矛盾 - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的 - 次要矛盾：在事物发展过程中处于从属地位的 - 主次矛盾的关系 - 制约关系：主要矛盾制约次要矛盾的发展方向 - 反作用：次要矛盾会影响主要矛盾 - 主次矛盾转化：主次矛盾在一定条件下可以相互转化 - 转化条件：当客观环境发生变化时，主次矛盾可能互换 - 阶段特征：人生不同阶段主要矛盾不同 - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理 - 矛盾的主次方面 - 主要方面：处于支配地位，起主导作用 - 次要方面：处于被支配地位 - 矛盾主次方面的关系 - 决定关系：**事物的性质由主要矛盾的主要方面决定** - 制约关系：次要方面制约主要方面的发挥 - 主次方面转化：主次方面在一定条件下可以相互转化 - 转化条件：当内外条件变化时，主次方面可能互换 - 性质改变：主次方面转化会导致事物根本性质变化 - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理 - 不平衡性的方法论：在于坚持两点论和重点论的统一 - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题 - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节 - 内因和外因 - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用 - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展 - 关系：外因通过内因而起作用 ##### 量变质变规律 - 区分的根本标志：判断**事物的变化是否超出度的范围** - 辩证关系 - 量变是质变的必要准备 - 质变是量变的必然结果，量变达到**一定程度**（**临界点**）必然引起质变 - 量变和质变相互渗透，互相包含 - 方法论：坚持**适度原则** - 坚持底线思维：保持变化在合理区间内，不要突破底线，否则可能会变质（往坏的方向质变，如贪污腐败） ##### 否定之否定规律 - 强调事物的发展呈现螺旋式上升、波浪式前进的规律 - 辩证的否定观 - **包含肯定的否定** - 肯定其积极的方面，否定其消极的方面 - 区别于形而上学的全盘肯定/否定 - 事物的自我否定：强调内因对于事物的发展起决定作用 - 实质是"**扬弃**" - 扬弃：既克服（糟粕）又保留（精华）的双重过程 - 区别于"新事物产生旧事物灭亡"的发展实质 - 发展和联系的环节：辩证的否定，是联系的环节，也是发展的环节 - 发展的环节：只有否定旧事物，事物才能向前发展。 - 联系的环节：新旧事物之间保留合理因素，通过辩证否定联系在一起 - 发展过程：**前进性和曲折性的统一** - 总趋势具有前进性 - 具体道路具有曲折性 #### 认识论 ##### 实践 - 含义：人类能动地改造世界的社会性的客观物质活动 - 实践的主体：人类 - 实践的客体：客观世界 - 特征 - 客观物质性 - 要素客观：实践的主体、客体、中介（如工具）等各方面要素都是客观的 - 规律制约：实践会受客观规律制约 - 直接现实性：能将主观想法（意愿）通过实际行动转化为客观现实 - 意识活动不具有直接现实性 - 实践活动不能突破客观条件或社会历史条件的制约 - 自觉能动性：强调的是实践是人**有意识**、**有目的**的活动（区别于动物本能） - 社会历史性 - 社会性：实践需在一定的社会关系中完成。 - 历史性 - 历史地形成：实践是在特定的历史时期中形成的，实践受当时特定的历史条件限制 - 历史地发展：实践经验具有继承性，后世的实践经验继承（借鉴）了前人的实践经验 - 基本形式：根据实践领域划分 - **物质生产实践**：**最基础的实践活动**，决定人类生存 - 社会政治实践：指改造社会关系的实践活动，是人们调整和处理人与人之间社会关系的实践 - 社会实践：是狭义的社会实践，指处理人与人社会关系的实践 - 政治实践 - 阶级对立：稳定社会中的阶级矛盾 - 阶级斗争：社会矛盾已经不可调和时，或矛盾激化后所产生的暴力冲突 - 科学文化实践：指探索未知、精神文化创作等实践活动，包含科学、艺术、教育等实践形式 ##### 认识 - 从认识论角度阐述的人对客观世界的认知，本质上是人脑对客观存在的主观映象 - 与意识的关系：认识是意识在认识论层面的具体表现，二者都涉及对客观世界的反映 - 基本属性 - 客观性：认识来源于客观世界并受客观事物制约 - 本质：认识内容不能脱离客观存在凭空产生 - 主观性：不同主体对同一事物产生差异性认知 ###### 认识的两次飞跃 1. 第一次飞跃：从**感性认识到理性认识**的过程 - 感性认识：对事物表面现象的认知 - 感觉：对事物单一特征的反应 - 知觉：对事物综合特征的反应 - 表象：事物在头脑中的回忆形象 - 理性认识：对事物本质规律的认知 - 概念：对事物下定义 - 判断：依据概念判定事物属性 - 推理：由已知推断未知 - 理性认识不必然正确（推理结论可能错误） 2. 第二次飞跃：从**理性认识到实践**的过程 - 本质：将形成的理性认识应用于实际生产生活动 - [实践是认识的目的和归宿](../philosophy/epistemology#实践决定认识)，产生认识后，最终要回归到实践当中 - 认识的真正任务是要达到理性认识 ###### 认识的过程 - 反复性：复杂事物需要多次认识 - 无限性：客观世界是不断发展的，认识也随之不断发展 ###### 认识的运动规律 - 核心：实践 $\rightarrow$ 认识 $\rightarrow$ 再实践 $\rightarrow$ 再认识，循环往复以至无穷，每次循环进入更高阶段 - 总体呈现螺旋式上升趋势 ###### 真理 - 标志着主观认识与客观实际相符合的哲学范畴 - 是一种正确的认识（区别于一般的理性认识） - 属性 - 客观性（**本质属性**） - 内容客观：真理内容不依赖于人的意识 - 检验标准客观：[实践作为检验标准](../philosophy/epistemology#实践决定认识)具有[直接现实性（客观实在性）](../philosophy/epistemology#实践的特征) - 绝对性（绝对真理）：真理是无条件的、绝对的 - 强调真理内容的确定性 - 相对性（相对真理）：真理的条件性 - 指真理的成立需要特定条件限制 - 强调真理适用条件的局限性 - 内容无条件正确，范围有条件限定 ##### 辩证关系 - 实践决定认识 1. 实践是认识的**唯一来源** - 认识只能通过实践获得，强调"**从无到有**"的过程 - 途径： - 直接经验：通过亲身实践获得 - 间接经验：通过他人实践获得 - 实践并不是认识的唯一途径 2. 实践是认识发展的**动力** - 通过实践推动认识发展，强调认识"从旧到新"或"从有到优"的演进过程 - 动力来源 - 新的需求：实践过程中产生了新需求，推动认识向前发展 - 新的物质手段：实践为认识的发展提供了新的物质手段 3. 实践是认识的**目的和归宿**：核心要义是指认识最终要指导实践来改造世界 4. 实践是检验认识是否具有真理性的**唯一标准** - 认识对实践的作用 - 正确的认识起促进作用 - 错误的认识起阻碍作用（认识对实践的反作用） ### 历史唯物主义 ## 马克思主义政治经济学 - 源于英国古典政治经济学 ## 科学社会主义 - 源于英法空想社会主义学说' name="twitter:description"/><meta content="/private/gongkao/xingce/political-theory/marxism/overview/" property="og:url"/><meta content="Roam Tech-verse | Roamverse Technical Blog" property="og:site_name"/><meta content="马克思主义基本原理——概览（持续更新中）" property="og:title"/><meta content='# 马克思主义 ## 总论 ### 《共产党宣言》 - 其发表标志着马克思主义的公开问世 - 首个中译本由陈望道翻译 ### 基本特征 - 科学性：体现理论正确性，被实践证明为真理体系 - 革命性 - 为无产阶级革命提供理论指导 - 内含辩证法的批判精神 - **实践性** - 马克思主义**首要的基本观点** - 强调"从实践中来，到实践中去" - **人民性**：坚持**人民至上的政治立场**，认为人民是历史的创造者 - 发展性：具有**与时俱进的理论品质** ### 马克思的核心发现 - 唯物史观 - 剩余价值学说 - 理论地位：构成马克思主义理论体系的**独创**性贡献 ## 马克思主义哲学 - 源于德国古典哲学（包含黑格尔辩证法、费尔巴哈唯物主义） ### 哲学的含义 - 哲学是理论化、系统化的世界观，是世界观和方法论的统一。 - 哲学是对自然知识、社会知识和思维知识的概括和总结。 - 世界观：对于世界的观点和看法，哲学 $\neq$ 世界观 - 方法论：基于世界观，如何解决问题的方法 - 世界观与方法论的核心关系 - 决定关系：世界观决定方法论 - 体现关系：方法论体现世界观 ### 具体科学与哲学的关系 - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的 - 基础作用：具体科学是哲学的基础 - 指导作用：哲学为具体科学提供世界观和方法论指导 - 哲学结论：**世界是不断发展的** - 哲学与具体科学不是整体与部分的关系 - 哲学是一般的、共性的，具体科学是特殊的、个性的 - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括 ### 哲学的基本派别 #### 划分依据 - 对哲学的基本问题（本原问题）的回答不同 - 哲学的基本问题是物质与意识（或思维与存在）的关系问题 - **第一性问题**：探究世界的本原。 - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点 - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点 - 同一性问题：探究世界是否可知的问题。 - 可知论：认为世界是可知的，意识能够认识物质世界 - 马克思认为世界是可知的 - 不可知论：意识不能认识客观世界 #### 唯物主义 - 划分标准：对于物质概念理解的不同 - 古代朴素唯物主义：认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等 - 有时代局限性，不是完全科学 - 根本正确性 - 承认物质是世界的本原这一基本观点是正确的 - 认识局限性 - 笼统性：将物质简单归结为具体物质形态，缺乏科学依据 - 直观猜测性：对物质的理解停留在直观猜测层面 - 无法解释复杂物质现象和精神现象的关系 - 近代形而上学唯物主义：基于原子论所形成 - 别称：机械唯物主义（机械性）、半截子唯物主义（不彻底性） - 缺陷 - 机械性 - 认为宇宙间所有运动都是机械运动 - 错误本质：将高级运动形式简单归结为机械位移 - **形而上学性** - 基本特征：**孤立、片面、静止**地看问题 - 孤立观点：否认事物之间的普遍联系 - 静止观点：否认事物的运动和发展 - 片面观点：否认认识的全面性和辩证性 - 不彻底性：唯物不彻底 - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义 - 本质：未能将唯物主义原则贯彻到底 - 现代唯物主义 - 马克思主义哲学是唯物主义发展的现代形态 - 本质属性是"**客观实在性**" - 客观实在性不是具体物质形态，而是抽象出的共同属性 - 物质：标志客观实在的哲学范畴 - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态 #### 唯心主义 - 主观唯心主义 - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切 - 强调"**人**、**我**、**心**"等主体要素 - 客观唯心主义 - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原 - 关键区别：精神主体是否独立于人类意识存在 ### 辩证唯物主义 #### 唯物论 ##### 物质 - 研究世界的本原问题 - 唯一特性（本质属性）：是**客观实在性** - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性 - 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止：是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性：尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 可以改变规律发生作用的条件 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 建立条件：依据固有联系 + 相应客观条件 - 人可以根据固有联系，改变事物状态，调整原有联系，建立新的具体联系，不能根据主观需要建立新的联系（通过创造条件来建立联系） - 多样性：联系具有多种类型和多种方式 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 关键部分在一定条件下对整体起决定作用 - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心**，又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：斗争性在任何条件下都存在 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - 有条件的、相对的 - 特殊性需要经过对比得来，多种情况之间互为条件 - 方法论：具体问题具体分析 - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性 - 普遍性存在于特殊性之中：共性存在于每个个体之中 - 矛盾发展的不平衡性 - 指事物从性质、地位、作用上的不一致（有主有次） - 主次矛盾 - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的 - 次要矛盾：在事物发展过程中处于从属地位的 - 主次矛盾的关系 - 制约关系：主要矛盾制约次要矛盾的发展方向 - 反作用：次要矛盾会影响主要矛盾 - 主次矛盾转化：主次矛盾在一定条件下可以相互转化 - 转化条件：当客观环境发生变化时，主次矛盾可能互换 - 阶段特征：人生不同阶段主要矛盾不同 - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理 - 矛盾的主次方面 - 主要方面：处于支配地位，起主导作用 - 次要方面：处于被支配地位 - 矛盾主次方面的关系 - 决定关系：**事物的性质由主要矛盾的主要方面决定** - 制约关系：次要方面制约主要方面的发挥 - 主次方面转化：主次方面在一定条件下可以相互转化 - 转化条件：当内外条件变化时，主次方面可能互换 - 性质改变：主次方面转化会导致事物根本性质变化 - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理 - 不平衡性的方法论：在于坚持两点论和重点论的统一 - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题 - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节 - 内因和外因 - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用 - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展 - 关系：外因通过内因而起作用 ##### 量变质变规律 - 区分的根本标志：判断**事物的变化是否超出度的范围** - 辩证关系 - 量变是质变的必要准备 - 质变是量变的必然结果，量变达到**一定程度**（**临界点**）必然引起质变 - 量变和质变相互渗透，互相包含 - 方法论：坚持**适度原则** - 坚持底线思维：保持变化在合理区间内，不要突破底线，否则可能会变质（往坏的方向质变，如贪污腐败） ##### 否定之否定规律 - 强调事物的发展呈现螺旋式上升、波浪式前进的规律 - 辩证的否定观 - **包含肯定的否定** - 肯定其积极的方面，否定其消极的方面 - 区别于形而上学的全盘肯定/否定 - 事物的自我否定：强调内因对于事物的发展起决定作用 - 实质是"**扬弃**" - 扬弃：既克服（糟粕）又保留（精华）的双重过程 - 区别于"新事物产生旧事物灭亡"的发展实质 - 发展和联系的环节：辩证的否定，是联系的环节，也是发展的环节 - 发展的环节：只有否定旧事物，事物才能向前发展。 - 联系的环节：新旧事物之间保留合理因素，通过辩证否定联系在一起 - 发展过程：**前进性和曲折性的统一** - 总趋势具有前进性 - 具体道路具有曲折性 #### 认识论 ##### 实践 - 含义：人类能动地改造世界的社会性的客观物质活动 - 实践的主体：人类 - 实践的客体：客观世界 - 特征 - 客观物质性 - 要素客观：实践的主体、客体、中介（如工具）等各方面要素都是客观的 - 规律制约：实践会受客观规律制约 - 直接现实性：能将主观想法（意愿）通过实际行动转化为客观现实 - 意识活动不具有直接现实性 - 实践活动不能突破客观条件或社会历史条件的制约 - 自觉能动性：强调的是实践是人**有意识**、**有目的**的活动（区别于动物本能） - 社会历史性 - 社会性：实践需在一定的社会关系中完成。 - 历史性 - 历史地形成：实践是在特定的历史时期中形成的，实践受当时特定的历史条件限制 - 历史地发展：实践经验具有继承性，后世的实践经验继承（借鉴）了前人的实践经验 - 基本形式：根据实践领域划分 - **物质生产实践**：**最基础的实践活动**，决定人类生存 - 社会政治实践：指改造社会关系的实践活动，是人们调整和处理人与人之间社会关系的实践 - 社会实践：是狭义的社会实践，指处理人与人社会关系的实践 - 政治实践 - 阶级对立：稳定社会中的阶级矛盾 - 阶级斗争：社会矛盾已经不可调和时，或矛盾激化后所产生的暴力冲突 - 科学文化实践：指探索未知、精神文化创作等实践活动，包含科学、艺术、教育等实践形式 ##### 认识 - 从认识论角度阐述的人对客观世界的认知，本质上是人脑对客观存在的主观映象 - 与意识的关系：认识是意识在认识论层面的具体表现，二者都涉及对客观世界的反映 - 基本属性 - 客观性：认识来源于客观世界并受客观事物制约 - 本质：认识内容不能脱离客观存在凭空产生 - 主观性：不同主体对同一事物产生差异性认知 ###### 认识的两次飞跃 1. 第一次飞跃：从**感性认识到理性认识**的过程 - 感性认识：对事物表面现象的认知 - 感觉：对事物单一特征的反应 - 知觉：对事物综合特征的反应 - 表象：事物在头脑中的回忆形象 - 理性认识：对事物本质规律的认知 - 概念：对事物下定义 - 判断：依据概念判定事物属性 - 推理：由已知推断未知 - 理性认识不必然正确（推理结论可能错误） 2. 第二次飞跃：从**理性认识到实践**的过程 - 本质：将形成的理性认识应用于实际生产生活动 - [实践是认识的目的和归宿](../philosophy/epistemology#实践决定认识)，产生认识后，最终要回归到实践当中 - 认识的真正任务是要达到理性认识 ###### 认识的过程 - 反复性：复杂事物需要多次认识 - 无限性：客观世界是不断发展的，认识也随之不断发展 ###### 认识的运动规律 - 核心：实践 $\rightarrow$ 认识 $\rightarrow$ 再实践 $\rightarrow$ 再认识，循环往复以至无穷，每次循环进入更高阶段 - 总体呈现螺旋式上升趋势 ###### 真理 - 标志着主观认识与客观实际相符合的哲学范畴 - 是一种正确的认识（区别于一般的理性认识） - 属性 - 客观性（**本质属性**） - 内容客观：真理内容不依赖于人的意识 - 检验标准客观：[实践作为检验标准](../philosophy/epistemology#实践决定认识)具有[直接现实性（客观实在性）](../philosophy/epistemology#实践的特征) - 绝对性（绝对真理）：真理是无条件的、绝对的 - 强调真理内容的确定性 - 相对性（相对真理）：真理的条件性 - 指真理的成立需要特定条件限制 - 强调真理适用条件的局限性 - 内容无条件正确，范围有条件限定 ##### 辩证关系 - 实践决定认识 1. 实践是认识的**唯一来源** - 认识只能通过实践获得，强调"**从无到有**"的过程 - 途径： - 直接经验：通过亲身实践获得 - 间接经验：通过他人实践获得 - 实践并不是认识的唯一途径 2. 实践是认识发展的**动力** - 通过实践推动认识发展，强调认识"从旧到新"或"从有到优"的演进过程 - 动力来源 - 新的需求：实践过程中产生了新需求，推动认识向前发展 - 新的物质手段：实践为认识的发展提供了新的物质手段 3. 实践是认识的**目的和归宿**：核心要义是指认识最终要指导实践来改造世界 4. 实践是检验认识是否具有真理性的**唯一标准** - 认识对实践的作用 - 正确的认识起促进作用 - 错误的认识起阻碍作用（认识对实践的反作用） ### 历史唯物主义 ## 马克思主义政治经济学 - 源于英国古典政治经济学 ## 科学社会主义 - 源于英法空想社会主义学说' property="og:description"/><meta content="zh_hans" property="og:locale"/><meta content="article" property="og:type"/><meta content="private" property="article:section"/><meta content="2026-10-09T13:14:26+00:00" property="article:published_time"/><meta content="2026-10-10T21:45:55+08:00" property="article:modified_time"/><meta content="马克思主义基本原理——概览（持续更新中）" itemprop="name"/><meta content='# 马克思主义 ## 总论 ### 《共产党宣言》 - 其发表标志着马克思主义的公开问世 - 首个中译本由陈望道翻译 ### 基本特征 - 科学性：体现理论正确性，被实践证明为真理体系 - 革命性 - 为无产阶级革命提供理论指导 - 内含辩证法的批判精神 - **实践性** - 马克思主义**首要的基本观点** - 强调"从实践中来，到实践中去" - **人民性**：坚持**人民至上的政治立场**，认为人民是历史的创造者 - 发展性：具有**与时俱进的理论品质** ### 马克思的核心发现 - 唯物史观 - 剩余价值学说 - 理论地位：构成马克思主义理论体系的**独创**性贡献 ## 马克思主义哲学 - 源于德国古典哲学（包含黑格尔辩证法、费尔巴哈唯物主义） ### 哲学的含义 - 哲学是理论化、系统化的世界观，是世界观和方法论的统一。 - 哲学是对自然知识、社会知识和思维知识的概括和总结。 - 世界观：对于世界的观点和看法，哲学 $\neq$ 世界观 - 方法论：基于世界观，如何解决问题的方法 - 世界观与方法论的核心关系 - 决定关系：世界观决定方法论 - 体现关系：方法论体现世界观 ### 具体科学与哲学的关系 - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的 - 基础作用：具体科学是哲学的基础 - 指导作用：哲学为具体科学提供世界观和方法论指导 - 哲学结论：**世界是不断发展的** - 哲学与具体科学不是整体与部分的关系 - 哲学是一般的、共性的，具体科学是特殊的、个性的 - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括 ### 哲学的基本派别 #### 划分依据 - 对哲学的基本问题（本原问题）的回答不同 - 哲学的基本问题是物质与意识（或思维与存在）的关系问题 - **第一性问题**：探究世界的本原。 - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点 - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点 - 同一性问题：探究世界是否可知的问题。 - 可知论：认为世界是可知的，意识能够认识物质世界 - 马克思认为世界是可知的 - 不可知论：意识不能认识客观世界 #### 唯物主义 - 划分标准：对于物质概念理解的不同 - 古代朴素唯物主义：认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等 - 有时代局限性，不是完全科学 - 根本正确性 - 承认物质是世界的本原这一基本观点是正确的 - 认识局限性 - 笼统性：将物质简单归结为具体物质形态，缺乏科学依据 - 直观猜测性：对物质的理解停留在直观猜测层面 - 无法解释复杂物质现象和精神现象的关系 - 近代形而上学唯物主义：基于原子论所形成 - 别称：机械唯物主义（机械性）、半截子唯物主义（不彻底性） - 缺陷 - 机械性 - 认为宇宙间所有运动都是机械运动 - 错误本质：将高级运动形式简单归结为机械位移 - **形而上学性** - 基本特征：**孤立、片面、静止**地看问题 - 孤立观点：否认事物之间的普遍联系 - 静止观点：否认事物的运动和发展 - 片面观点：否认认识的全面性和辩证性 - 不彻底性：唯物不彻底 - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义 - 本质：未能将唯物主义原则贯彻到底 - 现代唯物主义 - 马克思主义哲学是唯物主义发展的现代形态 - 本质属性是"**客观实在性**" - 客观实在性不是具体物质形态，而是抽象出的共同属性 - 物质：标志客观实在的哲学范畴 - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态 #### 唯心主义 - 主观唯心主义 - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切 - 强调"**人**、**我**、**心**"等主体要素 - 客观唯心主义 - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原 - 关键区别：精神主体是否独立于人类意识存在 ### 辩证唯物主义 #### 唯物论 ##### 物质 - 研究世界的本原问题 - 唯一特性（本质属性）：是**客观实在性** - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性 - 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止：是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性：尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 可以改变规律发生作用的条件 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 建立条件：依据固有联系 + 相应客观条件 - 人可以根据固有联系，改变事物状态，调整原有联系，建立新的具体联系，不能根据主观需要建立新的联系（通过创造条件来建立联系） - 多样性：联系具有多种类型和多种方式 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 关键部分在一定条件下对整体起决定作用 - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心**，又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：斗争性在任何条件下都存在 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - 有条件的、相对的 - 特殊性需要经过对比得来，多种情况之间互为条件 - 方法论：具体问题具体分析 - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性 - 普遍性存在于特殊性之中：共性存在于每个个体之中 - 矛盾发展的不平衡性 - 指事物从性质、地位、作用上的不一致（有主有次） - 主次矛盾 - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的 - 次要矛盾：在事物发展过程中处于从属地位的 - 主次矛盾的关系 - 制约关系：主要矛盾制约次要矛盾的发展方向 - 反作用：次要矛盾会影响主要矛盾 - 主次矛盾转化：主次矛盾在一定条件下可以相互转化 - 转化条件：当客观环境发生变化时，主次矛盾可能互换 - 阶段特征：人生不同阶段主要矛盾不同 - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理 - 矛盾的主次方面 - 主要方面：处于支配地位，起主导作用 - 次要方面：处于被支配地位 - 矛盾主次方面的关系 - 决定关系：**事物的性质由主要矛盾的主要方面决定** - 制约关系：次要方面制约主要方面的发挥 - 主次方面转化：主次方面在一定条件下可以相互转化 - 转化条件：当内外条件变化时，主次方面可能互换 - 性质改变：主次方面转化会导致事物根本性质变化 - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理 - 不平衡性的方法论：在于坚持两点论和重点论的统一 - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题 - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节 - 内因和外因 - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用 - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展 - 关系：外因通过内因而起作用 ##### 量变质变规律 - 区分的根本标志：判断**事物的变化是否超出度的范围** - 辩证关系 - 量变是质变的必要准备 - 质变是量变的必然结果，量变达到**一定程度**（**临界点**）必然引起质变 - 量变和质变相互渗透，互相包含 - 方法论：坚持**适度原则** - 坚持底线思维：保持变化在合理区间内，不要突破底线，否则可能会变质（往坏的方向质变，如贪污腐败） ##### 否定之否定规律 - 强调事物的发展呈现螺旋式上升、波浪式前进的规律 - 辩证的否定观 - **包含肯定的否定** - 肯定其积极的方面，否定其消极的方面 - 区别于形而上学的全盘肯定/否定 - 事物的自我否定：强调内因对于事物的发展起决定作用 - 实质是"**扬弃**" - 扬弃：既克服（糟粕）又保留（精华）的双重过程 - 区别于"新事物产生旧事物灭亡"的发展实质 - 发展和联系的环节：辩证的否定，是联系的环节，也是发展的环节 - 发展的环节：只有否定旧事物，事物才能向前发展。 - 联系的环节：新旧事物之间保留合理因素，通过辩证否定联系在一起 - 发展过程：**前进性和曲折性的统一** - 总趋势具有前进性 - 具体道路具有曲折性 #### 认识论 ##### 实践 - 含义：人类能动地改造世界的社会性的客观物质活动 - 实践的主体：人类 - 实践的客体：客观世界 - 特征 - 客观物质性 - 要素客观：实践的主体、客体、中介（如工具）等各方面要素都是客观的 - 规律制约：实践会受客观规律制约 - 直接现实性：能将主观想法（意愿）通过实际行动转化为客观现实 - 意识活动不具有直接现实性 - 实践活动不能突破客观条件或社会历史条件的制约 - 自觉能动性：强调的是实践是人**有意识**、**有目的**的活动（区别于动物本能） - 社会历史性 - 社会性：实践需在一定的社会关系中完成。 - 历史性 - 历史地形成：实践是在特定的历史时期中形成的，实践受当时特定的历史条件限制 - 历史地发展：实践经验具有继承性，后世的实践经验继承（借鉴）了前人的实践经验 - 基本形式：根据实践领域划分 - **物质生产实践**：**最基础的实践活动**，决定人类生存 - 社会政治实践：指改造社会关系的实践活动，是人们调整和处理人与人之间社会关系的实践 - 社会实践：是狭义的社会实践，指处理人与人社会关系的实践 - 政治实践 - 阶级对立：稳定社会中的阶级矛盾 - 阶级斗争：社会矛盾已经不可调和时，或矛盾激化后所产生的暴力冲突 - 科学文化实践：指探索未知、精神文化创作等实践活动，包含科学、艺术、教育等实践形式 ##### 认识 - 从认识论角度阐述的人对客观世界的认知，本质上是人脑对客观存在的主观映象 - 与意识的关系：认识是意识在认识论层面的具体表现，二者都涉及对客观世界的反映 - 基本属性 - 客观性：认识来源于客观世界并受客观事物制约 - 本质：认识内容不能脱离客观存在凭空产生 - 主观性：不同主体对同一事物产生差异性认知 ###### 认识的两次飞跃 1. 第一次飞跃：从**感性认识到理性认识**的过程 - 感性认识：对事物表面现象的认知 - 感觉：对事物单一特征的反应 - 知觉：对事物综合特征的反应 - 表象：事物在头脑中的回忆形象 - 理性认识：对事物本质规律的认知 - 概念：对事物下定义 - 判断：依据概念判定事物属性 - 推理：由已知推断未知 - 理性认识不必然正确（推理结论可能错误） 2. 第二次飞跃：从**理性认识到实践**的过程 - 本质：将形成的理性认识应用于实际生产生活动 - [实践是认识的目的和归宿](../philosophy/epistemology#实践决定认识)，产生认识后，最终要回归到实践当中 - 认识的真正任务是要达到理性认识 ###### 认识的过程 - 反复性：复杂事物需要多次认识 - 无限性：客观世界是不断发展的，认识也随之不断发展 ###### 认识的运动规律 - 核心：实践 $\rightarrow$ 认识 $\rightarrow$ 再实践 $\rightarrow$ 再认识，循环往复以至无穷，每次循环进入更高阶段 - 总体呈现螺旋式上升趋势 ###### 真理 - 标志着主观认识与客观实际相符合的哲学范畴 - 是一种正确的认识（区别于一般的理性认识） - 属性 - 客观性（**本质属性**） - 内容客观：真理内容不依赖于人的意识 - 检验标准客观：[实践作为检验标准](../philosophy/epistemology#实践决定认识)具有[直接现实性（客观实在性）](../philosophy/epistemology#实践的特征) - 绝对性（绝对真理）：真理是无条件的、绝对的 - 强调真理内容的确定性 - 相对性（相对真理）：真理的条件性 - 指真理的成立需要特定条件限制 - 强调真理适用条件的局限性 - 内容无条件正确，范围有条件限定 ##### 辩证关系 - 实践决定认识 1. 实践是认识的**唯一来源** - 认识只能通过实践获得，强调"**从无到有**"的过程 - 途径： - 直接经验：通过亲身实践获得 - 间接经验：通过他人实践获得 - 实践并不是认识的唯一途径 2. 实践是认识发展的**动力** - 通过实践推动认识发展，强调认识"从旧到新"或"从有到优"的演进过程 - 动力来源 - 新的需求：实践过程中产生了新需求，推动认识向前发展 - 新的物质手段：实践为认识的发展提供了新的物质手段 3. 实践是认识的**目的和归宿**：核心要义是指认识最终要指导实践来改造世界 4. 实践是检验认识是否具有真理性的**唯一标准** - 认识对实践的作用 - 正确的认识起促进作用 - 错误的认识起阻碍作用（认识对实践的反作用） ### 历史唯物主义 ## 马克思主义政治经济学 - 源于英国古典政治经济学 ## 科学社会主义 - 源于英法空想社会主义学说' itemprop="description"/><meta content="2026-10-09T13:14:26+00:00" itemprop="datePublished"/><meta content="2026-10-10T21:45:55+08:00" itemprop="dateModified"/><meta content="6367" itemprop="wordCount"/><meta content="Roamverse · Lin" itemprop="keywords"/><meta content="/images/logo.png" property="og:image"/><meta content="/images/logo.png" name="twitter:image"/><meta content="马克思主义基本原理——概览（持续更新中）" property="og:image:alt"/><meta content="马克思主义基本原理——概览（持续更新中）" name="twitter:image:alt"/><link href="/manifest.json" rel="manifest"/><link crossorigin="anonymous" data-precache="" href="/assets/main/bundle.min.ee509778b6f0ef7cdedf19b1b41f890dbfa0cca107383b7e03dc7712f9bad1d4.css" integrity="sha256-7lCXeLbw73ze3xmxtB+JDb+gzKEHODt+A9x3Evm60dQ=" rel="stylesheet"/><link crossorigin="anonymous" data-precache="" href="/assets/katex/bundle.min.a6f8b2e1ce0a11cd3d55d2d182cb6b0ae4b7371ef47dd997096f07f07d9980f7.css" integrity="sha256-pviy4c4KEc09VdLRgstrCuS3Nx70fdmXCW8H8H2ZgPc=" rel="stylesheet"/><link crossorigin="anonymous" data-precache="" href="/assets/viewer/bundle.min.a886788faf7d8b4b13a0398bf9e9434cc952f8d6297efdad1453da43257e8a30.css" integrity="sha256-qIZ4j699i0sToDmL+elDTMlS+NYpfv2tFFPaQyV+ijA=" rel="stylesheet"/><style data-pagevault-runtime="true">

  background: linear-gradient(135deg, #3b79d5, #6da0ed);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}

.pagevault-button:hover {
  opacity: 0.9;
}

.pagevault-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagevault-error {
  color: #dc3545;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.pagevault-remember {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: #666;
}

.pagevault-remember input {
  margin: 0;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-container { background: #1e1e2e; border-color: #444; }
  .pagevault-title { color: #e0e0e0; }
  .pagevault-hint { color: #999; }
  .pagevault-input { background: #2a2a3a; border-color: #555; color: #e0e0e0; }
  .pagevault-remember { color: #999; }
}
</style><script data-pagevault-runtime="true">
/* pagevault runtime v4 */
(function() {
  'use strict';

  var CONFIG = {
    title: "受保护内容",
    buttonText: "解锁笔记",
    errorText: "密码错误，请重试",
    placeholder: "请输入密码",
    usernamePlaceholder: "Enter username",
    defaultRemember: "session",
    rememberDays: 1,
    autoPrompt: true
  };
  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // v4 chunked crypto helpers for region + wrap decryption.
  //
  // Usage:
  //   const result = await decryptV4(envelope, chunks, password, username, onProgress);
  //   // result is {bytes: Uint8Array, meta: object} or null on failure.
  //
  // The envelope is the parsed JSON from a <script data-pv-meta>/<script id="pv-meta"> tag.
  // chunks is an ordered array of base64 strings (region callers pass
  // the chunk text content; wrap callers typically collect from the DOM
  // and remove each element after decryption to free memory).

  function _hexToBytes(hex) {
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < hex.length; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  function _b64ToBytes(b64) {
    const raw = atob(b64);
    const bytes = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
    return bytes;
  }

  function _deriveChunkIv(ivBase, chunkIndex) {
    const iv = new Uint8Array(ivBase);
    iv[8]  ^= (chunkIndex >>> 24) & 0xFF;
    iv[9]  ^= (chunkIndex >>> 16) & 0xFF;
    iv[10] ^= (chunkIndex >>> 8)  & 0xFF;
    iv[11] ^=  chunkIndex         & 0xFF;
    return iv;
  }

  async function _deriveKey(secret, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits', 'deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: salt, iterations: 310000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
  }

  // Content integrity hash used by region decryption to verify
  // meta.content_hash against the decrypted text. Matches Python's
  // content_hash(): first 16 bytes of SHA-256(utf-8(content)) as hex.
  async function computeHash(content) {
    const encoder = new TextEncoder();
    const data = encoder.encode(content);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = new Uint8Array(hashBuffer).slice(0, 16);
    return Array.from(hashArray, b => b.toString(16).padStart(2, '0')).join('');
  }

  async function decryptV4(envelope, chunks, password, username, onProgress) {
    try {
      if (envelope.v !== 4) {
        throw new Error('Unsupported envelope version: ' + envelope.v);
      }

      const salt = _hexToBytes(envelope.salt);
      const secret = username ? username + ':' + password : password;
      const wrappingKey = await _deriveKey(secret, salt);

      // Unwrap CEK — try each key blob until one succeeds.
      let cekRaw = null;
      for (const keyBlob of envelope.keys) {
        const blobIv = _b64ToBytes(keyBlob.iv);
        const blobCt = _b64ToBytes(keyBlob.ct);
        try {
          cekRaw = await crypto.subtle.decrypt(
            { name: 'AES-GCM', iv: blobIv }, wrappingKey, blobCt
          );
          break;
        } catch (e) { continue; }
      }
      if (!cekRaw) throw new Error('No matching key found — wrong password?');

      const cek = await crypto.subtle.importKey(
        'raw', cekRaw, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
      );

      // Decrypt metadata (independent of chunks).
      const metaIv = _b64ToBytes(envelope.meta_iv);
      const metaCt = _b64ToBytes(envelope.meta_ct);
      const metaPlain = await crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: metaIv }, cek, metaCt
      );
      const meta = JSON.parse(new TextDecoder().decode(metaPlain));

      // Decrypt chunks.
      const ivBase = _b64ToBytes(envelope.iv_base);
      const parts = [];
      let totalLen = 0;
      for (let i = 0; i < envelope.chunk_count; i++) {
        const b64 = chunks[i];
        if (typeof b64 !== 'string') {
          throw new Error('Missing chunk ' + i);
        }
        const ct = _b64ToBytes(b64);
        const chunkIv = _deriveChunkIv(ivBase, i);
        const plain = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: chunkIv }, cek, ct
        );
        const plainBytes = new Uint8Array(plain);
        parts.push(plainBytes);
        totalLen += plainBytes.length;
        if (onProgress) onProgress(i + 1, envelope.chunk_count);
      }

      // Concatenate chunks into one contiguous Uint8Array.
      const bytes = new Uint8Array(totalLen);
      let offset = 0;
      for (const p of parts) {
        bytes.set(p, offset);
        offset += p.length;
      }

      return { bytes: bytes, meta: meta };
    } catch (e) {
      console.error('v4 decryption failed:', e);
      return null;
    }
  }

  // readV4FromScope — collect encrypted envelope + chunk texts from the DOM.
  //
  // Supports two layouts:
  //   Region format: <script data-pv-meta> + <script data-pv-chunk="N"> siblings
  //                  inside a <pagevault> element.
  //   Wrap format:   <script id="pv-meta"> + <script id="pv-N"> at document level.
  //
  // Arguments:
  //   scope — the element to search within (a <pagevault> el for region;
  //            document for wrap).
  //
  // Returns {envelope, chunks} where envelope is the parsed JSON object and
  // chunks is an ordered array of base64 strings, or null if the meta script
  // is not found.  Each chunk element is removed from the DOM after being read
  // to free memory.

  function readV4FromScope(scope) {
    // --- Locate meta script ---
    var metaScript = null;

    // Region layout: direct child with data-pv-meta attribute
    if (scope.querySelector) {
      metaScript = scope.querySelector('script[data-pv-meta]');
    }
    // Wrap layout fallback: <script id="pv-meta"> anywhere in document
    if (!metaScript) {
      metaScript = document.getElementById('pv-meta');
    }
    if (!metaScript) return null;

    var envelope;
    try {
      envelope = JSON.parse(metaScript.textContent);
    } catch (e) {
      console.error('[pagevault] Invalid pv-meta JSON:', e);
      return null;
    }

    var chunks = [];

    // --- Collect chunks: region layout (data-pv-chunk attribute) ---
    var chunkTags = [];
    if (scope.querySelectorAll) {
      var tagged = scope.querySelectorAll('script[data-pv-chunk]');
      for (var i = 0; i < tagged.length; i++) {
        var el = tagged[i];
        var idx = parseInt(el.getAttribute('data-pv-chunk'), 10);
        if (!Number.isNaN(idx)) {
          chunkTags.push([idx, el.textContent || '', el]);
        }
      }
    }

    if (chunkTags.length > 0) {
      // Sort by index and extract text; remove each element to free memory.
      chunkTags.sort(function(a, b) { return a[0] - b[0]; });
      for (var j = 0; j < chunkTags.length; j++) {
        chunks.push(chunkTags[j][1]);
        chunkTags[j][2].remove();
      }
    } else {
      // --- Wrap layout fallback: <script id="pv-N"> ---
      var count = envelope.chunk_count || 0;
      for (var k = 0; k < count; k++) {
        var chunkEl = document.getElementById('pv-' + k);
        if (!chunkEl) {
          console.error('[pagevault] Missing chunk element pv-' + k);
          return null;
        }
        chunks.push(chunkEl.textContent || '');
        chunkEl.remove();
      }
    }

    return { envelope: envelope, chunks: chunks };
  }

  // Storage utilities
  const STORAGE_KEY = 'pagevault_passwords';

  function getStoredPasswords() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (!stored) return {};
      const data = JSON.parse(stored);
      // Check expiration
      const now = Date.now();
      const filtered = {};
      for (const [key, value] of Object.entries(data)) {
        if (!value.expires || value.expires > now) {
          filtered[key] = value;
        }
      }
      return filtered;
    } catch {
      return {};
    }
  }

  function storeCredentials(password, username, remember) {
    if (remember === 'none') return;
    const cred = username ? { username, password } : { password };
    if (remember === 'session') {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(cred));
      return;
    }
    const data = getStoredPasswords();
    const expires = CONFIG.rememberDays > 0
      ? Date.now() + (CONFIG.rememberDays * 24 * 60 * 60 * 1000)
      : null;
    data[location.origin] = { ...cred, expires };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function getStoredCredentials() {
    // Check session first
    const session = sessionStorage.getItem(STORAGE_KEY);
    if (session) {
      try {
        const cred = JSON.parse(session);
        return cred.password ? cred : { password: session };
      } catch {
        return { password: session };
      }
    }
    // Check localStorage
    const data = getStoredPasswords();
    const entry = data[location.origin];
    if (!entry) return null;
    return entry.password ? entry : null;
  }

  function clearStoredPasswords() {
    localStorage.removeItem(STORAGE_KEY);
    sessionStorage.removeItem(STORAGE_KEY);
  }

  // URL fragment handling (only logout — password via URL removed for security)
  function checkFragment() {
    const hash = location.hash.slice(1);
    if (!hash) return null;

    if (hash === 'pagevault_logout') {
      clearStoredPasswords();
      // Navigate without the hash — works on file:// unlike history.replaceState
      location.replace(location.pathname + location.search);
      return 'logout';
    }

    return null;
  }

// === Script activation infrastructure ===
  // Snapshot the original page methods ONCE at runtime load. All handlers
  // share these — concurrent decryption is serialized via __pvActivationChain
  // so the shims always restore the true originals, never another handler's shim.
  var __pvOrigDocAddListener = document.addEventListener.bind(document);
  var __pvOrigWinAddListener = window.addEventListener.bind(window);
  var __pvOrigDocWrite = document.write.bind(document);
  var __pvOrigDocWriteln = document.writeln.bind(document);
  var __pvActivationChain = Promise.resolve();

  // Re-execute scripts in a decrypted region. The browser does not run
  // <script> tags inserted via innerHTML, so we re-create each one.
  // Inline scripts run synchronously on replaceChild; external scripts
  // (with src) load asynchronously — we wait for onload before the next.
  // Lifecycle events (DOMContentLoaded, load) already fired before
  // decryption, so we shim them, collect callbacks, and fire after
  // activation. Errors in any script are caught and logged so the
  // shims always restore via the finally block.
  function __pvActivateContent(el, meta, done) {
    var origOnload = window.onload;  // snapshot for change-detection
    var dclCallbacks = [];
    var wlCallbacks = [];

    // Install shims (page-wide for the duration of activation)
    document.write = function(s) {
      if (s) console.warn('[pagevault] document.write() suppressed during activation:', s);
    };
    document.writeln = function(s) {
      if (s) console.warn('[pagevault] document.writeln() suppressed during activation:', s);
    };
    document.addEventListener = function(type, fn, opts) {
      if (type === 'DOMContentLoaded') dclCallbacks.push(fn);
      else __pvOrigDocAddListener(type, fn, opts);
    };
    window.addEventListener = function(type, fn, opts) {
      if (type === 'load') wlCallbacks.push(fn);
      else __pvOrigWinAddListener(type, fn, opts);
    };

    function restoreShims() {
      document.addEventListener = __pvOrigDocAddListener;
      window.addEventListener = __pvOrigWinAddListener;
      document.write = __pvOrigDocWrite;
      document.writeln = __pvOrigDocWriteln;
    }

    // Permissive JS MIME-type detection (matches HTML spec)
    function isExecutable(s) {
      var t = (s.getAttribute('type') || '').toLowerCase();
      if (!t) return true;
      if (t === 'module') return true;
      return /javascript|ecmascript|jscript/.test(t);
    }

    var scripts = Array.from(el.querySelectorAll('script'));

    function finalize() {
      restoreShims();
      dclCallbacks.forEach(function(fn) {
        try { fn(); } catch(e) { console.error('[pagevault] DOMContentLoaded callback error:', e); }
      });
      wlCallbacks.forEach(function(fn) {
        try { fn(); } catch(e) { console.error('[pagevault] load callback error:', e); }
      });
      // Only re-fire onload if a decrypted script REPLACED it
      if (typeof window.onload === 'function' && window.onload !== origOnload) {
        try { window.onload(new Event('load')); } catch(e) { console.error('[pagevault] onload error:', e); }
      }
      el.dispatchEvent(new CustomEvent('pagevault:activated', {
        bubbles: true,
        detail: { element: el, meta: meta }
      }));
      done();
    }

    function activateNext(i) {
      try {
        // Loop through synchronous (inline) scripts; only recurse on async boundary
        while (i < scripts.length) {
          var old = scripts[i];
          if (!isExecutable(old)) { i++; continue; }
          if (!old.parentNode) { i++; continue; }  // ancestor was removed by an earlier script
          var s = document.createElement('script');
          for (var j = 0; j < old.attributes.length; j++) {
            var a = old.attributes[j];
            s.setAttribute(a.name, a.value);
          }
          var hasSrc = old.hasAttribute('src');
          if (!hasSrc && old.textContent) s.textContent = old.textContent;
          if (hasSrc) {
            // Capture index and src in IIFE so closures don't share mutated state
            (function(idx, srcUrl) {
              s.onload = function() { activateNext(idx + 1); };
              s.onerror = function() {
                console.error('[pagevault] Failed to load:', srcUrl);
                activateNext(idx + 1);
              };
            })(i, old.getAttribute('src'));
            old.parentNode.replaceChild(s, old);
            return;  // suspend until onload/onerror fires
          }
          old.parentNode.replaceChild(s, old);
          i++;
        }
        finalize();
      } catch (e) {
        console.error('[pagevault] script activation error:', e);
        try { finalize(); } catch(_) {}
      }
    }

    activateNext(0);
  }

  // Element handler — uses a plain class instead of Custom Elements because
  // the spec requires hyphenated names and <pagevault> has no hyphen.
  // All values set via innerHTML are either:
  //   - escapeHtml()-wrapped user strings (hint, title, placeholder, button text)
  //   - static HTML template literals (form structure, lock icon)
  //   - decrypted content from AES-256-GCM (trusted after authenticated decryption)
  class PagevaultHandler {
    constructor(el) {
      this.el = el;
      this.el._pvDecrypted = false;
      // Snapshot v4 envelope + chunks before rendering the prompt
      // (rendering clears innerHTML which would discard them).
      // readV4FromScope is provided by core/chunks.js.
      this._snapshot = readV4FromScope(el);
      this._render();
      this._tryAutoDecrypt();
    }

    _render() {
      const el = this.el;
      const hint = el.getAttribute('data-hint');
      const title = el.getAttribute('data-title') || CONFIG.title;
      const remember = el.getAttribute('data-remember') || CONFIG.defaultRemember;
      const isUserMode = el.getAttribute('data-mode') === 'user';

      el.innerHTML = `
        <div class="pagevault-container">
          <div class="pagevault-icon">🔒</div>
          <div class="pagevault-title">${escapeHtml(title)}</div>
          ${hint ? `<div class="pagevault-hint">${escapeHtml(hint)}</div>` : ''}
          <form class="pagevault-form">
            ${isUserMode ? `<input type="text" class="pagevault-input pagevault-username" placeholder="${escapeHtml(CONFIG.usernamePlaceholder)}" autocomplete="username">` : ''}
            <input type="password" class="pagevault-input" placeholder="${escapeHtml(CONFIG.placeholder)}" autocomplete="current-password">
            ${remember === 'ask' ? `
              <label class="pagevault-remember">
                <input type="checkbox" name="remember">
                Remember on this device
              </label>
            ` : ''}
            <button type="submit" class="pagevault-button">${escapeHtml(CONFIG.buttonText)}</button>
            <div class="pagevault-error" style="display: none;"></div>
          </form>
        </div>
      `;

      const form = el.querySelector('form');
      const passwordInput = el.querySelector('input[type="password"]');
      const usernameInput = el.querySelector('.pagevault-username');
      const error = el.querySelector('.pagevault-error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        if (!password) return;
        const username = usernameInput ? usernameInput.value : null;

        // Capture checkbox state BEFORE decryption replaces innerHTML
        const rememberCheckbox = el.querySelector('input[name="remember"]');
        const wantsRemember = remember === 'local' || (rememberCheckbox && rememberCheckbox.checked);

        const button = el.querySelector('button');
        button.disabled = true;
        button.textContent = 'Decrypting...';

        const success = await this._decrypt(password, username);

        if (!success) {
          error.textContent = CONFIG.errorText;
          error.style.display = 'block';
          button.disabled = false;
          button.textContent = CONFIG.buttonText;
          passwordInput.value = '';
          passwordInput.focus();
        } else {
          // Store credentials if requested
          if (wantsRemember) {
            storeCredentials(password, username, 'local');
          } else if (remember === 'session') {
            storeCredentials(password, username, 'session');
          }
        }
      });

      // Focus appropriate input if auto-prompt
      if (CONFIG.autoPrompt) {
        const focusTarget = usernameInput || passwordInput;
        setTimeout(() => focusTarget.focus(), 100);
      }
    }

    async _tryAutoDecrypt() {
      // Check URL fragment (only logout supported)
      const fragment = checkFragment();
      if (fragment === 'logout') return;

      // Try stored credentials
      const cred = getStoredCredentials();
      if (cred) {
        await this._decrypt(cred.password, cred.username || null);
      }
    }

    async _decrypt(password, username) {
      const el = this.el;
      if (!this._snapshot) return false;

      const result = await decryptV4(
        this._snapshot.envelope,
        this._snapshot.chunks,
        password,
        username
      );
      if (result === null) return false;

      const meta = result.meta || {};
      if (meta.kind && meta.kind !== 'html_fragment') {
        console.error('Unexpected envelope kind for region:', meta.kind);
        return false;
      }

      // Decode UTF-8 text and strip trailing NUL padding (from --pad).
      let content = new TextDecoder().decode(result.bytes);
      content = content.replace(/\0+$/, '');

      // Verify content hash if present in encrypted metadata.
      const expectedHash = meta.content_hash;
      if (expectedHash) {
        const actualHash = await computeHash(content);
        if (actualHash !== expectedHash) {
          console.error('Content hash mismatch - decryption may be corrupted');
          return false;
        }
      }

      // Clear v4 attributes and reveal content.
      el.removeAttribute('data-pv-v4');
      el.removeAttribute('data-mode');
      // Decrypted content is trusted — it was authenticated by AES-256-GCM
      // (user encrypted their own content; AES-GCM provides authenticity)
      el.innerHTML = content;
      el._pvDecrypted = true;

      // Fire decrypted event immediately — content is in the DOM,
      // listeners that just need to know "the content is here" don't
      // wait for script activation. A separate pagevault:activated
      // event fires after all scripts have run.
      el.dispatchEvent(new CustomEvent('pagevault:decrypted', {
        bubbles: true,
        detail: { element: el, meta: meta }
      }));

      // Serialize script activation across handlers via a page-level
      // promise chain. Global shims (document.addEventListener,
      // document.write, etc.) cannot be safely interleaved across
      // concurrent decryptions, so we ensure only one activation runs
      // at a time. See __pvActivateContent for the activation routine.
      __pvActivationChain = __pvActivationChain.then(function() {
        return new Promise(function(resolve) {
          __pvActivateContent(el, meta, resolve);
        });
      });

      return true;
    }
  }

  // Initialize all v4-encrypted <pagevault> elements.
  // Wrapped in DOMContentLoaded since the script is in <head> but the
  // elements are in <body> — they don't exist yet at script parse time.
  function initAll() {
    document.querySelectorAll('pagevault[data-pv-v4]').forEach(function(el) {
      if (!el._pvHandler) {
        el._pvHandler = new PagevaultHandler(el);
      }
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
