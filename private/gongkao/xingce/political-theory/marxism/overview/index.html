    # 马克思主义

## 《共产党宣言》

- 其发表标志着马克思主义的公开问世
- 首个中译本由陈望道翻译

## 特征

- 科学性
- 体现理论正确性，被实践证明为真理体系
- 革命性
    - 为无产阶级革命提供理论指导
    - 内含辩证法的批判精神
- **实践性**
    - 马克思主义**首要的基本观点**
    - 强调"从实践中来，到实践中去"
- **人民性**
    - 坚持**人民至上的政治立场**，认为人民是历史的创造者
- 发展性
    - 具有**与时俱进的理论品质**
	
## 马克思的核心发现

- 唯物史观
- 剩余价值学说
- 理论地位
    - 构成马克思主义理论体系的**独创**性贡献

## 马克思主义哲学

- 源于德国古典哲学
    - 黑格尔辩证法
    - 费尔巴哈唯物主义

### 哲学的含义

- 哲学是理论化、系统化的世界观，是世界观和方法论的统一。
- 哲学是对自然知识、社会知识和思维知识的概括和总结。
- 世界观：对于世界的观点和看法
    - 哲学 $\neq$ 世界观
- 方法论：基于世界观，如何解决问题的方法
- 世界观与方法论的核心关系
    - 决定关系：世界观决定方法论
    - 体现关系：方法论体现世界观
- 具体科学与哲学的关系
    - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的
    - 基础作用：具体科学是哲学的基础
    - 指导作用：哲学为具体科学提供世界观和方法论指导
    - 哲学结论：**世界是不断发展的**
    - 哲学与具体科学不是整体与部分的关系
        - 哲学是一般的、共性的，具体科学是特殊的、个性的
        - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括

### 哲学的基本派别

#### 划分依据

- 对哲学的基本问题（本原问题）的回答不同
    - 哲学的基本问题是物质与意识（或思维与存在）的关系问题
- **第一性问题**：探究世界的本原。
    - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点
    - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点
- 同一性问题：探究世界是否可知的问题。
    - 可知论：认为世界是可知的，意识能够认识物质世界
        - 马克思认为世界是可知的
    - 不可知论：意识不能认识客观世界

#### 唯物主义

- 划分标准：对于物质概念理解的不同
- 古代朴素唯物主义
    - 认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等
    - 有时代局限性，不是完全科学
    - 根本正确性
        - 承认物质是世界的本原这一基本观点是正确的
    - 认识局限性
        - 笼统性
            - 将物质简单归结为具体物质形态，缺乏科学依据
        - 直观猜测性
            - 对物质的理解停留在直观猜测层面
        - 无法解释复杂物质现象和精神现象的关系
- 近代形而上学唯物主义
    - 基于原子论所形成
    - 别称
        - 机械唯物主义（机械性）
        - 半截子唯物主义（不彻底性）
    - 缺陷
        - 机械性
            - 认为宇宙间所有运动都是机械运动
            - 错误本质：将高级运动形式简单归结为机械位移
        - **形而上学性**
            - 基本特征：**孤立、片面、静止**地看问题
            - 孤立观点：否认事物之间的普遍联系
            - 静止观点：否认事物的运动和发展
            - 片面观点：否认认识的全面性和辩证性
        - 不彻底性
            - 唯物不彻底
            - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义
            - 本质：未能将唯物主义原则贯彻到底
- 现代唯物主义
    - 马克思主义哲学是现代唯物主义的一个代表学派
    - 本质属性是"**客观实在性**"
        - 客观实在性不是具体物质形态，而是抽象出的共同属性
    - 物质定义：具有客观实在性的事物即为物质
    - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态

#### 唯心主义

- 主观唯心主义
    - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切
    - 强调"**人**、**我**、**心**"等主体要素
- 客观唯心主义
    - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原
- 关键区别：精神主体是否独立于人类意识存在

### 辩证唯物主义

#### 唯物论

##### 物质

- 研究世界的本原问题
- 唯一特性（本质属性）：是**客观实在性**
    - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性
    - 客观：不以人的意志为转移
    - 实在：能够被人的意识所反映
- 运动
    - 运动是物质的**根本属性**、**固有属性**和**存在方式**
        - 运动是**无条件的**、**永恒的**、**绝对的**
    - 物质是运动的承担者，是运动的主体
- 静止
    - 是一种不显著的运动，是运动的一种特殊状态
    - 静止是**有条件的**、**暂时的**、**相对的**
    - _不存在绝对静止的物质_
- 世界上的事物都是绝对运动和相对静止的统一
- 时间和空间是运动着的物质的存在方式
    - 空间：占据位置
    - 时间：存在过程
        - 时间特性：时间具有一维性，即时间是不可逆的

##### 意识

- 本质是人脑对客观存在的主观映象
    - _强调客观存在通过人脑形成主观认知的过程_
- 来源于客观存在（客观世界）
    - 人脑：意识的器官
    - 意识并非来源（产生）于人脑
    - 仅有大脑而无客观接触无法形成意识
- 就其形式而言是主观的，就其内容而言是客观的
    - 形式主观：个体表达存在差异，不同人描述同一事物方式不同
	- 内容客观：反映对象真实存在，基于客观存在的事物进行反映
- 能动作用
    - 目的性和计划性：意识活动具有目的性和计划性
	- 创造性：意识活动具有创造性
	- 指导作用：意识具有**指导实践改造客观世界的作用**
		- 意识不能直接改造世界（仅靠想象无法改变现实）
		- 精神力量需通过实践转化为物质力量
	- 调控作用：意识具有调控行为和生理活动的作用

##### 物质与意识的辩证关系

- 原理
    - 物质决定意识
        - 客观世界未出现的物质不会产生相应意识
    - 意识具有能动作用
        - 正确的意识起促进作用
        - 错误的意识起阻碍作用
- 方法论
    - 一切从实际出发
    - 重视发挥主观能动性
        - 尊重客观规律是正确发挥主观能动性的前提
- 规律的客观性
    - 规律具有客观性
        - 不能创造、消灭或改变规律
        - 只能认识、利用规律
    - 意味着规律不依赖于人的意识，不以人的意志为转移

#### 辩证法

- 两大特征：联系和发展

##### 联系

- 特征
    - **客观性**：强调联系是客观的，不以人的意志为转移
        - 客观联系
            - 自在事物的联系：指自然界本身存在的联系
            - 人为事物的联系：指人为建立起来的联系
        - 违背客观性的联系
            - 人为强加的联系：指主观臆造、没有现实依据的联系
    - **普遍性**：强调联系是普遍存在的
        - 事物处于普遍联系之中
        - _联系可能随时建立_
    - 条件性：联系需要特定条件才能建立
        - 不是随便两个事物天然就存在联系
    - 多样性：联系具有多种类型和多种方式
    - 人可以根据固有联系建立新的联系，不能根据主观需要建立新的联系
- 整体与部分的关系
    - 也可称为系统与要素的关系
    - 依赖关系：整体与部分相互依赖
    - 决定关系
        - 整体决定部分
        - 部分影响整体
        - 只有**关键部分才能决定整体**
    - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能
        - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌
        - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$）
        - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果

##### 发展

- 实质是**新事物的产生**和**旧事物的灭亡**
    - 新旧事物区分
        - 是否同事物发展的必然趋势相符合
        - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物
        - 力量强大的事物 $\neq$ 新事物
    - 新事物：符合事物发展的必然趋势
    - 旧事物：不符合事物发展的必然趋势
- 将前进的、上升的运动称为"发展"

##### 三大规律

##### 对立统一规律

- 是辩证法的**实质与核心**
- 又称为矛盾规律
- 矛盾的基本属性
    - 同一性
        - 有条件的、相对的
        - 相互依存：指的是矛盾双方互为存在的前提
            - "你离不开我，我离不开你"
        - 相互贯通
            - 相互渗透：矛盾双方相互包含
                - "你中有我，我中有你"
            - 相互转化：在一定条件下，由矛盾的一方转化为另一方
                - "你变成了我，我变成了你"
    - 斗争性
        - 无条件的、绝对的
            - 无条件性：矛盾是相互对立的，必然是相互排斥的，不需要任何条件
        - 相互排斥：矛盾双方相互对抗的关系
            - "你多我少"，"你死我活"，"死对头"
        - 相互分离：矛盾双方保持各自独立性质。
	        - "你就是你，我就是我"
    - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现
- 矛盾问题的精髓
    - 普遍性：指矛盾是**无处不在**，**无时不有**
        - 无条件的、绝对的
        - 方法论：全面地看问题（一分为二的观点看问题）
            - 要同时看到一个事物的多方面（如好和坏）
    - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性）
        - 有条件的、相对的
            - 特殊性需要经过对比得来，多种情况之间互为条件
        - 方法论：具体问题具体分析
    - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性
        - 普遍性存在于特殊性之中：共性存在于每个个体之中
- 矛盾发展的不平衡性
    - 指事物从性质、地位、作用上的不一致（有主有次）
    - 主次矛盾
        - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的
        - 次要矛盾：在事物发展过程中处于从属地位的
        - 主次矛盾的关系
            - 制约关系：主要矛盾制约次要矛盾的发展方向
            - 反作用：次要矛盾会影响主要矛盾
            - 主次矛盾转化：主次矛盾在一定条件下可以相互转化
                - 转化条件：当客观环境发生变化时，主次矛盾可能互换
                - 阶段特征：人生不同阶段主要矛盾不同
        - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理
    - 矛盾的主次方面
        - 主要方面：处于支配地位，起主导作用
        - 次要方面：处于被支配地位
        - 矛盾主次方面的关系
            - 决定关系：**事物的性质由主要矛盾的主要方面决定**
            - 制约关系：次要方面制约主要方面的发挥
            - 主次方面转化：主次方面在一定条件下可以相互转化
                - 转化条件：当内外条件变化时，主次方面可能互换
                - 性质改变：主次方面转化会导致事物根本性质变化
        - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理
    - 不平衡性的方法论：在于坚持两点论和重点论的统一
        - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题
        - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节
- 内因和外因
    - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用
    - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展
    - 关系：外因通过内因而起作用

' name="description"/><meta content="summary" name="twitter:card"/><meta content="马克思主义基本原理——概览（持续更新中）" name="twitter:title"/><meta content='# 马克思主义 ## 《共产党宣言》 - 其发表标志着马克思主义的公开问世 - 首个中译本由陈望道翻译 ## 特征 - 科学性 - 体现理论正确性，被实践证明为真理体系 - 革命性 - 为无产阶级革命提供理论指导 - 内含辩证法的批判精神 - **实践性** - 马克思主义**首要的基本观点** - 强调"从实践中来，到实践中去" - **人民性** - 坚持**人民至上的政治立场**，认为人民是历史的创造者 - 发展性 - 具有**与时俱进的理论品质** ## 马克思的核心发现 - 唯物史观 - 剩余价值学说 - 理论地位 - 构成马克思主义理论体系的**独创**性贡献 ## 马克思主义哲学 - 源于德国古典哲学 - 黑格尔辩证法 - 费尔巴哈唯物主义 ### 哲学的含义 - 哲学是理论化、系统化的世界观，是世界观和方法论的统一。 - 哲学是对自然知识、社会知识和思维知识的概括和总结。 - 世界观：对于世界的观点和看法 - 哲学 $\neq$ 世界观 - 方法论：基于世界观，如何解决问题的方法 - 世界观与方法论的核心关系 - 决定关系：世界观决定方法论 - 体现关系：方法论体现世界观 - 具体科学与哲学的关系 - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的 - 基础作用：具体科学是哲学的基础 - 指导作用：哲学为具体科学提供世界观和方法论指导 - 哲学结论：**世界是不断发展的** - 哲学与具体科学不是整体与部分的关系 - 哲学是一般的、共性的，具体科学是特殊的、个性的 - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括 ### 哲学的基本派别 #### 划分依据 - 对哲学的基本问题（本原问题）的回答不同 - 哲学的基本问题是物质与意识（或思维与存在）的关系问题 - **第一性问题**：探究世界的本原。 - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点 - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点 - 同一性问题：探究世界是否可知的问题。 - 可知论：认为世界是可知的，意识能够认识物质世界 - 马克思认为世界是可知的 - 不可知论：意识不能认识客观世界 #### 唯物主义 - 划分标准：对于物质概念理解的不同 - 古代朴素唯物主义 - 认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等 - 有时代局限性，不是完全科学 - 根本正确性 - 承认物质是世界的本原这一基本观点是正确的 - 认识局限性 - 笼统性 - 将物质简单归结为具体物质形态，缺乏科学依据 - 直观猜测性 - 对物质的理解停留在直观猜测层面 - 无法解释复杂物质现象和精神现象的关系 - 近代形而上学唯物主义 - 基于原子论所形成 - 别称 - 机械唯物主义（机械性） - 半截子唯物主义（不彻底性） - 缺陷 - 机械性 - 认为宇宙间所有运动都是机械运动 - 错误本质：将高级运动形式简单归结为机械位移 - **形而上学性** - 基本特征：**孤立、片面、静止**地看问题 - 孤立观点：否认事物之间的普遍联系 - 静止观点：否认事物的运动和发展 - 片面观点：否认认识的全面性和辩证性 - 不彻底性 - 唯物不彻底 - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义 - 本质：未能将唯物主义原则贯彻到底 - 现代唯物主义 - 马克思主义哲学是现代唯物主义的一个代表学派 - 本质属性是"**客观实在性**" - 客观实在性不是具体物质形态，而是抽象出的共同属性 - 物质定义：具有客观实在性的事物即为物质 - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态 #### 唯心主义 - 主观唯心主义 - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切 - 强调"**人**、**我**、**心**"等主体要素 - 客观唯心主义 - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原 - 关键区别：精神主体是否独立于人类意识存在 ### 辩证唯物主义 #### 唯物论 ##### 物质 - 研究世界的本原问题 - 唯一特性（本质属性）：是**客观实在性** - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性 - 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止 - 是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性 - 尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - _联系可能随时建立_ - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 多样性：联系具有多种类型和多种方式 - 人可以根据固有联系建立新的联系，不能根据主观需要建立新的联系 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心** - 又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：矛盾是相互对立的，必然是相互排斥的，不需要任何条件 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - 有条件的、相对的 - 特殊性需要经过对比得来，多种情况之间互为条件 - 方法论：具体问题具体分析 - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性 - 普遍性存在于特殊性之中：共性存在于每个个体之中 - 矛盾发展的不平衡性 - 指事物从性质、地位、作用上的不一致（有主有次） - 主次矛盾 - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的 - 次要矛盾：在事物发展过程中处于从属地位的 - 主次矛盾的关系 - 制约关系：主要矛盾制约次要矛盾的发展方向 - 反作用：次要矛盾会影响主要矛盾 - 主次矛盾转化：主次矛盾在一定条件下可以相互转化 - 转化条件：当客观环境发生变化时，主次矛盾可能互换 - 阶段特征：人生不同阶段主要矛盾不同 - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理 - 矛盾的主次方面 - 主要方面：处于支配地位，起主导作用 - 次要方面：处于被支配地位 - 矛盾主次方面的关系 - 决定关系：**事物的性质由主要矛盾的主要方面决定** - 制约关系：次要方面制约主要方面的发挥 - 主次方面转化：主次方面在一定条件下可以相互转化 - 转化条件：当内外条件变化时，主次方面可能互换 - 性质改变：主次方面转化会导致事物根本性质变化 - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理 - 不平衡性的方法论：在于坚持两点论和重点论的统一 - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题 - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节 - 内因和外因 - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用 - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展 - 关系：外因通过内因而起作用 ##### 量变质变规律 ##### 否定之否定规律 #### 认识论 ### 历史唯物主义 ## 马克思主义政治经济学 - 源于英国古典政治经济学 ## 科学社会主义 - 源于英法空想社会主义学说' name="twitter:description"/><meta content="/private/gongkao/xingce/political-theory/marxism/overview/" property="og:url"/><meta content="Roam Tech-verse | Roamverse Technical Blog" property="og:site_name"/><meta content="马克思主义基本原理——概览（持续更新中）" property="og:title"/><meta content='# 马克思主义 ## 《共产党宣言》 - 其发表标志着马克思主义的公开问世 - 首个中译本由陈望道翻译 ## 特征 - 科学性 - 体现理论正确性，被实践证明为真理体系 - 革命性 - 为无产阶级革命提供理论指导 - 内含辩证法的批判精神 - **实践性** - 马克思主义**首要的基本观点** - 强调"从实践中来，到实践中去" - **人民性** - 坚持**人民至上的政治立场**，认为人民是历史的创造者 - 发展性 - 具有**与时俱进的理论品质** ## 马克思的核心发现 - 唯物史观 - 剩余价值学说 - 理论地位 - 构成马克思主义理论体系的**独创**性贡献 ## 马克思主义哲学 - 源于德国古典哲学 - 黑格尔辩证法 - 费尔巴哈唯物主义 ### 哲学的含义 - 哲学是理论化、系统化的世界观，是世界观和方法论的统一。 - 哲学是对自然知识、社会知识和思维知识的概括和总结。 - 世界观：对于世界的观点和看法 - 哲学 $\neq$ 世界观 - 方法论：基于世界观，如何解决问题的方法 - 世界观与方法论的核心关系 - 决定关系：世界观决定方法论 - 体现关系：方法论体现世界观 - 具体科学与哲学的关系 - 哲学的理论是基于具体科学理论（自然知识、社会知识和思维知识）的总结而形成的 - 基础作用：具体科学是哲学的基础 - 指导作用：哲学为具体科学提供世界观和方法论指导 - 哲学结论：**世界是不断发展的** - 哲学与具体科学不是整体与部分的关系 - 哲学是一般的、共性的，具体科学是特殊的、个性的 - 哲学不是简单地汇总具体科学，是对具体科学的抽象概括 ### 哲学的基本派别 #### 划分依据 - 对哲学的基本问题（本原问题）的回答不同 - 哲学的基本问题是物质与意识（或思维与存在）的关系问题 - **第一性问题**：探究世界的本原。 - 物质第一性：崇尚物质是世界的本原，坚持的是唯物主义的观点 - 意识第一性：崇尚意识是世界的本原，坚持的是唯心主义的观点 - 同一性问题：探究世界是否可知的问题。 - 可知论：认为世界是可知的，意识能够认识物质世界 - 马克思认为世界是可知的 - 不可知论：意识不能认识客观世界 #### 唯物主义 - 划分标准：对于物质概念理解的不同 - 古代朴素唯物主义 - 认为物质是"实物"，将世界的本原归结为某种或某几种具体的物质形态，如五行、阴阳、形、气等 - 有时代局限性，不是完全科学 - 根本正确性 - 承认物质是世界的本原这一基本观点是正确的 - 认识局限性 - 笼统性 - 将物质简单归结为具体物质形态，缺乏科学依据 - 直观猜测性 - 对物质的理解停留在直观猜测层面 - 无法解释复杂物质现象和精神现象的关系 - 近代形而上学唯物主义 - 基于原子论所形成 - 别称 - 机械唯物主义（机械性） - 半截子唯物主义（不彻底性） - 缺陷 - 机械性 - 认为宇宙间所有运动都是机械运动 - 错误本质：将高级运动形式简单归结为机械位移 - **形而上学性** - 基本特征：**孤立、片面、静止**地看问题 - 孤立观点：否认事物之间的普遍联系 - 静止观点：否认事物的运动和发展 - 片面观点：否认认识的全面性和辩证性 - 不彻底性 - 唯物不彻底 - 表现：自然观上坚持唯物主义，历史观上陷入唯心主义 - 本质：未能将唯物主义原则贯彻到底 - 现代唯物主义 - 马克思主义哲学是现代唯物主义的一个代表学派 - 本质属性是"**客观实在性**" - 客观实在性不是具体物质形态，而是抽象出的共同属性 - 物质定义：具有客观实在性的事物即为物质 - 理论突破：克服了古代朴素和近代形而上学的局限性，实现了唯物主义的科学形态 #### 唯心主义 - 主观唯心主义 - 核心观点：认为**人的主观精神**（意识、思维、心灵等）是世界的本原，决定世界上的一切 - 强调"**人**、**我**、**心**"等主体要素 - 客观唯心主义 - 核心观点：认为**独立于人之外的客观精神**（神灵、理念、法则等）是宇宙的本原 - 关键区别：精神主体是否独立于人类意识存在 ### 辩证唯物主义 #### 唯物论 ##### 物质 - 研究世界的本原问题 - 唯一特性（本质属性）：是**客观实在性** - 马克思主义的物质范畴是从万事万物中抽象出的客观实在性 - 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止 - 是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性 - 尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - _联系可能随时建立_ - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 多样性：联系具有多种类型和多种方式 - 人可以根据固有联系建立新的联系，不能根据主观需要建立新的联系 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心** - 又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：矛盾是相互对立的，必然是相互排斥的，不需要任何条件 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - 有条件的、相对的 - 特殊性需要经过对比得来，多种情况之间互为条件 - 方法论：具体问题具体分析 - 关系：**普遍性存在于（寓于）特殊性之中**，特殊性中包含着普遍性 - 普遍性存在于特殊性之中：共性存在于每个个体之中 - 矛盾发展的不平衡性 - 指事物从性质、地位、作用上的不一致（有主有次） - 主次矛盾 - 主要矛盾：在事物发展过程中处于支配地位，起决定作用的 - 次要矛盾：在事物发展过程中处于从属地位的 - 主次矛盾的关系 - 制约关系：主要矛盾制约次要矛盾的发展方向 - 反作用：次要矛盾会影响主要矛盾 - 主次矛盾转化：主次矛盾在一定条件下可以相互转化 - 转化条件：当客观环境发生变化时，主次矛盾可能互换 - 阶段特征：人生不同阶段主要矛盾不同 - 判断标准：强调"如何解决问题"时，通常考察主次矛盾原理 - 矛盾的主次方面 - 主要方面：处于支配地位，起主导作用 - 次要方面：处于被支配地位 - 矛盾主次方面的关系 - 决定关系：**事物的性质由主要矛盾的主要方面决定** - 制约关系：次要方面制约主要方面的发挥 - 主次方面转化：主次方面在一定条件下可以相互转化 - 转化条件：当内外条件变化时，主次方面可能互换 - 性质改变：主次方面转化会导致事物根本性质变化 - 判断标准：强调"如何看待问题"时，通常考察矛盾主次方面原理 - 不平衡性的方法论：在于坚持两点论和重点论的统一 - 两点论：既要看到主次矛盾，又要看到矛盾的主次方面，全面分析问题 - 重点论：解决问题抓主要矛盾，评价事物抓主要方面，把握关键环节 - 内因和外因 - 内因：即内部矛盾，是事物发展变化的**根据**，对事物的发展起决定作用 - 外因：即外部矛盾，是事物发展变化的**条件**，会影响事物的发展 - 关系：外因通过内因而起作用 ##### 量变质变规律 ##### 否定之否定规律 #### 认识论 ### 历史唯物主义 ## 马克思主义政治经济学 - 源于英国古典政治经济学 ## 科学社会主义 - 源于英法空想社会主义学说' property="og:description"/><meta content="zh_hans" property="og:locale"/><meta content="article" property="og:type"/><meta content="private" property="article:section"/><meta content="2026-10-09T13:14:26+00:0 客观：不以人的意志为转移 - 实在：能够被人的意识所反映 - 运动 - 运动是物质的**根本属性**、**固有属性**和**存在方式** - 运动是**无条件的**、**永恒的**、**绝对的** - 物质是运动的承担者，是运动的主体 - 静止 - 是一种不显著的运动，是运动的一种特殊状态 - 静止是**有条件的**、**暂时的**、**相对的** - _不存在绝对静止的物质_ - 世界上的事物都是绝对运动和相对静止的统一 - 时间和空间是运动着的物质的存在方式 - 空间：占据位置 - 时间：存在过程 - 时间特性：时间具有一维性，即时间是不可逆的 ##### 意识 - 本质是人脑对客观存在的主观映象 - _强调客观存在通过人脑形成主观认知的过程_ - 来源于客观存在（客观世界） - 人脑：意识的器官 - 意识并非来源（产生）于人脑 - 仅有大脑而无客观接触无法形成意识 - 就其形式而言是主观的，就其内容而言是客观的 - 形式主观：个体表达存在差异，不同人描述同一事物方式不同 - 内容客观：反映对象真实存在，基于客观存在的事物进行反映 - 能动作用 - 目的性和计划性：意识活动具有目的性和计划性 - 创造性：意识活动具有创造性 - 指导作用：意识具有**指导实践改造客观世界的作用** - 意识不能直接改造世界（仅靠想象无法改变现实） - 精神力量需通过实践转化为物质力量 - 调控作用：意识具有调控行为和生理活动的作用 ##### 物质与意识的辩证关系 - 原理 - 物质决定意识 - 客观世界未出现的物质不会产生相应意识 - 意识具有能动作用 - 正确的意识起促进作用 - 错误的意识起阻碍作用 - 方法论 - 一切从实际出发 - 重视发挥主观能动性 - 尊重客观规律是正确发挥主观能动性的前提 - 规律的客观性 - 规律具有客观性 - 不能创造、消灭或改变规律 - 只能认识、利用规律 - 意味着规律不依赖于人的意识，不以人的意志为转移 #### 辩证法 - 两大特征：联系和发展 ##### 联系 - 特征 - **客观性**：强调联系是客观的，不以人的意志为转移 - 客观联系 - 自在事物的联系：指自然界本身存在的联系 - 人为事物的联系：指人为建立起来的联系 - 违背客观性的联系 - 人为强加的联系：指主观臆造、没有现实依据的联系 - **普遍性**：强调联系是普遍存在的 - 事物处于普遍联系之中 - _联系可能随时建立_ - 条件性：联系需要特定条件才能建立 - 不是随便两个事物天然就存在联系 - 多样性：联系具有多种类型和多种方式 - 人可以根据固有联系建立新的联系，不能根据主观需要建立新的联系 - 整体与部分的关系 - 也可称为系统与要素的关系 - 依赖关系：整体与部分相互依赖 - 决定关系 - 整体决定部分 - 部分影响整体 - 只有**关键部分才能决定整体** - 有机结合：整体是各个部分的有机结合，整体具有部分所没有的新功能 - 整体是各部分按一定的层次/顺序/逻辑的组合，并非简单堆砌 - 有机结合时：整体具有部分没有的新功能（即 $1+1 \gt 2$） - 无序（混乱）组合时：可能会产生 $1+1 \lt 2$ 的效果 ##### 发展 - 实质是**新事物的产生**和**旧事物的灭亡** - 新旧事物区分 - 是否同事物发展的必然趋势相符合 - 并非简单的参照时间标准进行区分，新出现的事物并不等同于哲学中的新事物 - 力量强大的事物 $\neq$ 新事物 - 新事物：符合事物发展的必然趋势 - 旧事物：不符合事物发展的必然趋势 - 将前进的、上升的运动称为"发展" ##### 三大规律 ##### 对立统一规律 - 是辩证法的**实质与核心** - 又称为矛盾规律 - 矛盾的基本属性 - 同一性 - 有条件的、相对的 - 相互依存：指的是矛盾双方互为存在的前提 - "你离不开我，我离不开你" - 相互贯通 - 相互渗透：矛盾双方相互包含 - "你中有我，我中有你" - 相互转化：在一定条件下，由矛盾的一方转化为另一方 - "你变成了我，我变成了你" - 斗争性 - 无条件的、绝对的 - 无条件性：矛盾是相互对立的，必然是相互排斥的，不需要任何条件 - 相互排斥：矛盾双方相互对抗的关系 - "你多我少"，"你死我活"，"死对头" - 相互分离：矛盾双方保持各自独立性质。 - "你就是你，我就是我" - 关系：**斗争性寓于同一性之中**，同一性通过斗争性来实现 - 矛盾问题的精髓 - 普遍性：指矛盾是**无处不在**，**无时不有** - 无条件的、绝对的 - 方法论：全面地看问题（一分为二的观点看问题） - 要同时看到一个事物的多方面（如好和坏） - 特殊性：指的是不同事物矛盾各不相同，都有其特殊性（个性） - /* pagevault styles */

pagevault {
  display: block;
}

pagevault[data-pv-v4] {
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pagevault-container {
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  border-radius: 8px;
  background: #f9f9f9;
  max-width: 400px;
  margin: 2rem auto;
}

.pagevault-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
}

.pagevault-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: #333;
}

.pagevault-hint {
  color: #666;
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.pagevault-form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.pagevault-input {
  padding: 0.75rem 1rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.pagevault-input:focus {
  border-color: #3b79d5;
}

.pagevault-button {
  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, #3b79d5, #6da0ed);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}

.pagevault-button:hover {
  opacity: 0.9;
}

.pagevault-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagevault-error {
  color: #dc3545;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.pagevault-remember {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: #666;
}

.pagevault-remember input {
  margin: 0;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-container { background: #1e1e2e; border-color: #444; }
  .pagevault-title { color: #e0e0e0; }
  .pagevault-hint { color: #999; }
  .pagevault-input { background: #2a2a3a; border-color: #555; color: #e0e0e0; }
  .pagevault-remember { color: #999; }
}
