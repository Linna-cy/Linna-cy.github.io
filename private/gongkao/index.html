/* pagevault styles */

pagevault {
  display: block;
}

pagevault[data-pv-v4] {
  min-height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pagevault-container {
  text-align: center;
  padding: 2rem;
  border: 2px dashed #ccc;
  border-radius: 8px;
  background: #f9f9f9;
  max-width: 400px;
  margin: 2rem auto;
}

.pagevault-icon {
  font-size: 3rem;
  margin-bottom: 1rem;
}

.pagevault-title {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: #333;
}

.pagevault-hint {
  color: #666;
  font-size: 0.9rem;
  margin-bottom: 1rem;
}

.pagevault-form {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.pagevault-input {
  padding: 0.75rem 1rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.pagevault-input:focus {
  border-color: #4CAF50;
}

.pagevault-button {
  padding: 0.75rem 1rem;
  background: linear-gradient(135deg, #4CAF50, #76B852);
  color: white;
  border: none;
  border-radius: 4px;
  font-size: 1rem;
  cursor: pointer;
  transition: opacity 0.2s;
}

.pagevault-button:hover {
  opacity: 0.9;
}

.pagevault-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pagevault-error {
  color: #dc3545;
  font-size: 0.9rem;
  margin-top: 0.5rem;
}

.pagevault-remember {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.9rem;
  color: #666;
}

.pagevault-remember input {
  margin: 0;
}

/* Dark mode */
@media (prefers-color-scheme: dark) {
  .pagevault-container { background: #1e1e2e; border-color: #444; }
  .pagevault-title { color: #e0e0e0; }
  .pagevault-hint { color: #999; }
  .pagevault-input { background: #2a2a3a; border-color: #555; color: #e0e0e0; }
  .pagevault-remember { color: #999; }
}
